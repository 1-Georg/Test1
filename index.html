function miniChart(p){
  const v=p.slice(-12), W=320, H=96, px=6, pt=8, pb=8;
  const n=v.length, top=Math.max(200,Math.ceil(Math.max.apply(null,v)/100)*100);
  const xs=i=>px+(W-px*2)*(n<2?0:i/(n-1)), y=x=>pt+(H-pt-pb)*(1-x/top);
  const flaeche=n>1?`<polygon points="${v.map((x,i)=>xs(i)+','+y(x)).join(' ')} ${xs(n-1)},${H-pb} ${xs(0)},${H-pb}" fill="rgba(255,176,32,.16)"/>`:'';
  const linie=n>1?`<polyline fill="none" stroke="#ffb020" stroke-width="2" stroke-linejoin="round" points="${v.map((x,i)=>xs(i)+','+y(x)).join(' ')}"/>`:'';
  const punkte=v.map((x,i)=>`<circle cx="${xs(i)}" cy="${y(x)}" r="${i===n-1?4:2.5}" fill="${i===n-1?'#ffffff':'#ffb020'}"/>`).join('');
  const letzterWert=v[n-1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;margin-top:8px">
    <line x1="${px}" y1="${H-pb}" x2="${W-px}" y2="${H-pb}" stroke="#1e2b3a"/>
    ${flaeche}${linie}${punkte}</svg>
    <div class="skalatext"><span>vor ${n-1} ${n-1===1?'Lauf':'Läufen'}</span><span>dieser Lauf ${letzterWert}</span></div>`;
}
function verlaufChart(v){
  const W=320,H=132,px=28,pb=18,pt=10;
  const n=v.length, xs=i=>px+(W-px-12)*(n<2?0:i/(n-1));
  const p=v.map(r=>r.punkte!==undefined?r.punkte:Math.round((r.idx!==undefined?r.idx:r.gesamt)/4));
  const top=Math.max(200,Math.ceil(Math.max.apply(null,p)/200)*200);
  const y=x=>pt+(H-pt-pb)*(1-x/top);
  let grid='';
  [0,top/2,top].forEach(g=>{ grid+=`<line x1="${px}" y1="${y(g)}" x2="${W-12}" y2="${y(g)}" stroke="#1e2b3a" stroke-width="1"/>
    <text x="${px-5}" y="${y(g)+3}" fill="#6b7d92" font-size="8" text-anchor="end" font-family="var(--mono)">${g}</text>`; });
  // gleitender Schnitt über drei Läufe
  let sn='';
  if(n>=3){
    const gl=p.map((_,i)=>{ const a=Math.max(0,i-2), t=p.slice(a,i+1); return t.reduce((x,z)=>x+z,0)/t.length; });
    sn=`<polyline fill="none" stroke="#4fd6e0" stroke-width="1.6" stroke-dasharray="4 3" points="${gl.map((x,i)=>xs(i)+','+y(x)).join(' ')}"/>`;
  }
  const flaeche=n>1?`<polygon points="${p.map((x,i)=>xs(i)+','+y(x)).join(' ')} ${xs(n-1)},${y(0)} ${xs(0)},${y(0)}" fill="rgba(255,176,32,.16)"/>`:'';
  const linie=n>1?`<polyline fill="none" stroke="#ffb020" stroke-width="2" stroke-linejoin="round" points="${p.map((x,i)=>xs(i)+','+y(x)).join(' ')}"/>`:'';
  const punkte=v.map((r,i)=>`<circle cx="${xs(i)}" cy="${y(p[i])}" r="2.6" fill="${r.stufe==='schwer'?'#ff5c5c':r.stufe==='mittel'?'#ffb020':'#4fd6e0'}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${grid}${flaeche}${sn}${linie}${punkte}</svg>
    <p class="sub" style="font-size:12px;margin-top:6px">Punkte je Lauf. Die gestrichelte Linie ist der Schnitt der letzten drei Läufe. Punktfarbe zeigt die Stufe: türkis leicht, gelb mittel, rot schwer.</p>`;
}

    ${U.gewaehlt!==null?`<button class="btn" id="lkneuU">NÄCHSTE AUFGABE</button>`:''}

function lkBinde(){
  const id=x=>document.getElementById(x);
  view.querySelectorAll('.lksteps button').forEach(b=>b.addEventListener('click',()=>{
    LK.lektion=+b.dataset.l; renderLernen(); }));
  const reg=id('lkregler');
  if(reg) reg.addEventListener('input',e=>{
    LK.faltT=(+e.target.value)/100;
    const b=id('lkbuehne'); if(b) b.innerHTML=lkSzene(LK.faltNetz,LK.faltZahlen,LK.faltT); });
  view.querySelectorAll('.lknw').forEach(b=>b.addEventListener('click',()=>{
    lkNeuFalt(LK.faltNr + (+b.dataset.nz)); LK.faltT=0; renderLernen(); }));
  const a=id('lkauto');
  if(a) a.addEventListener('click',()=>{
    let t=0; const iv=setInterval(()=>{ t+=0.02; if(t>=1){t=1;clearInterval(iv);}
      LK.faltT=t; if(reg) reg.value=Math.round(t*100);
      const b=id('lkbuehne'); if(b) b.innerHTML=lkSzene(LK.faltNetz,LK.faltZahlen,t); },28); });
  const n1=id('lkneu1'); if(n1) n1.addEventListener('click',()=>{ lkNeuFalt(LK.faltNr); LK.faltT=0; renderLernen(); });
  view.querySelectorAll('.lknf').forEach(g=>g.addEventListener('click',()=>{
    if(LK.lektion!==1) return;
    const D=lkDaten2(); LK.s2Feld=g.dataset.k;
    const i=D.paare.findIndex(p=>p.indexOf(LK.s2Feld)>=0);
    if(i>=0) LK.s2Auf[i]=1;
    renderLernen(); }));
  const n2=id('lkneu2'); if(n2) n2.addEventListener('click',()=>{
    LK.s2=null; LK.s3=null; LK.dreh=null; LK.s2Auf={}; LK.s2Feld=null; renderLernen(); });
  const n3=id('lkneu3'); if(n3) n3.addEventListener('click',()=>{ LK.s3=null; renderLernen(); });
  view.querySelectorAll('.lkdreh button[data-d]').forEach(b=>b.addEventListener('click',()=>{
    const d=b.dataset.d;
    const r = d==='up'?W_RX : d==='down'?wApp(wApp(W_RX,W_RX),W_RX)
            : d==='left'?W_RY : d==='right'?wApp(wApp(W_RY,W_RY),W_RY) : W_RZ;
    LK.dreh=wApp(LK.dreh,r); LK.drehZaehler++; renderLernen(); }));
  const r4=id('lkreset4'); if(r4) r4.addEventListener('click',()=>{
    LK.dreh=LK.drehStart.slice(); LK.drehZaehler=0; renderLernen(); });
  view.querySelectorAll('.lkopt[data-u]').forEach(b=>b.addEventListener('click',()=>{
    if(LK.uebung.gewaehlt!==null) return;
    LK.uebung.gewaehlt=+b.dataset.u;
    if(LK.uebung.gewaehlt===LK.uebung.loesung) LK.geloest[4]=1;
    renderLernen(); }));
  const hh=id('lkhilfe'); if(hh) hh.addEventListener('click',()=>{ LK.uebung.hilfe++; renderLernen(); });
  const nu=id('lkneuU'); if(nu) nu.addEventListener('click',()=>{ lkNeueUebung(); renderLernen(); });
  const wt=id('lkweiter');
  if(wt) wt.addEventListener('click',()=>{
    if(LK.lektion===1 && Object.keys(LK.s2Auf).length<3) return;
    LK.geloest[LK.lektion]=1;
    LK.lektion=Math.min(4,LK.lektion+1);
    renderLernen(); window.scrollTo({top:0,behavior:'smooth'}); });
  const z=id('lkzurueck'); if(z) z.addEventListener('click',renderMenu);
}

      <div class="stat"><span class="k">Schnellste Reaktionszeit</span><span class="v">${(Math.min.apply(null,v.map(r=>r.rt||99999))/1000).toFixed(1)} s</span></div>

        return `<div class="stat"><span class="k">${datum(r.t)} · ${r.stufe}${r.doppel?' · doppelt':''}</span><span class="v">${pp} Punkte · ${r.gesamt}%</span></div>`;}).join('')}

      <div class="stat"><span class="k" style="color:#ffb020">ab 200</span><span class="v" style="color:#ffb020">AUFBAU</span></div>
      <div class="stat"><span class="k" style="color:#ffb020">ab 350</span><span class="v" style="color:#ffb020">SOLIDE</span></div>

      <p class="sub" style="margin-top:6px;font-size:13px">Gesicherten Code einfügen. Bereits vorhandene Läufe bleiben erhalten, doppelte Einträge werden nicht angelegt.</p>
      <textarea id="impFeld" rows="3" placeholder="Code hier einfügen"
        style="width:100%;margin-top:10px;background:#0b1119;border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:12px;padding:10px;resize:vertical"></textarea>
      <button class="btn ghost" id="wiederher">WIEDERHERSTELLEN</button>
      <div id="impErg"></div>
    </div>
    <button class="btn ghost" id="back">ZURÜCK</button>
    <button class="btn ghost" id="clr" style="color:var(--red);border-color:var(--red)">VERLAUF LÖSCHEN</button>`;
  document.getElementById('back').addEventListener('click',renderMenu);
  document.getElementById('clr').addEventListener('click',()=>{
    if(clrBestaetigt){ loescheVerlauf(); clrBestaetigt=false; renderVerlauf(); }
    else { clrBestaetigt=true; const b=document.getElementById('clr'); b.textContent='WIRKLICH LÖSCHEN, ANTIPPEN ZUM BESTÄTIGEN'; }
  });
  document.getElementById('sichern').addEventListener('click',()=>{
    const code=exportCode(), box=document.getElementById('sicherBox');
    if(!code){ box.innerHTML='<p class="sub" style="margin-top:10px;color:var(--red)">Keine Daten zum Sichern vorhanden.</p>'; box.classList.remove('hidden'); return; }
    box.innerHTML=`
      <textarea id="expFeld" rows="3" readonly
        style="width:100%;margin-top:10px;background:#0b1119;border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:12px;padding:10px;resize:vertical">${code}</textarea>
      <button class="btn ghost" id="kopieren">CODE KOPIEREN</button>
      <p class="sub" id="kopierStatus" style="margin-top:6px;font-size:12px"></p>`;
    box.classList.remove('hidden');
    document.getElementById('expFeld').addEventListener('click',e=>e.target.select());
    document.getElementById('kopieren').addEventListener('click',()=>{
      const f=document.getElementById('expFeld'); f.select();
      const fertig=t=>{ document.getElementById('kopierStatus').textContent=t; };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(f.value).then(()=>fertig('Kopiert.')).catch(()=>{
          try{ document.execCommand('copy'); fertig('Kopiert.'); }catch(e){ fertig('Bitte den Text von Hand markieren und kopieren.'); }
        });
      } else {
        try{ document.execCommand('copy'); fertig('Kopiert.'); }catch(e){ fertig('Bitte den Text von Hand markieren und kopieren.'); }
      }
    });
  });
  document.getElementById('wiederher').addEventListener('click',()=>{
    const code=document.getElementById('impFeld').value;
    const erg=document.getElementById('impErg');
    if(!code.trim()){ erg.innerHTML='<p class="sub" style="margin-top:8px;color:var(--red)">Kein Code eingefügt.</p>'; return; }
    const r=importCode(code);
    if(!r.ok){ erg.innerHTML='<p class="sub" style="margin-top:8px;color:var(--red)">Der Code lässt sich nicht lesen. Bitte vollständig kopieren.</p>'; return; }
    const vorhanden=ladeVerlauf();
    const zeiten=new Set(vorhanden.map(x=>x.t));
    const neue=r.daten.filter(x=>!zeiten.has(x.t));
    const zusammen=vorhanden.concat(neue).sort((a,b)=>a.t-b.t).slice(-60);
    try{ localStorage.setItem(LS, JSON.stringify(zusammen)); }catch(e){}
    erg.innerHTML=`<p class="sub" style="margin-top:8px;color:var(--green)">${neue.length} ${neue.length===1?'Lauf':'Läufe'} übernommen${r.daten.length-neue.length?', '+(r.daten.length-neue.length)+' waren schon vorhanden':''}.</p>`;
    setTimeout(renderVerlauf, 900);
  });
}

/* Menütaste und Tastatur */
menuBtn.addEventListener('click',()=>modal.classList.remove('hidden'));
document.getElementById('mNo').addEventListener('click',()=>modal.classList.add('hidden'));
document.getElementById('mYes').addEventListener('click',()=>{modal.classList.add('hidden');renderMenu();});
document.addEventListener('keydown',e=>{
  if(!modal.classList.contains('hidden')) return;
  if(e.key==='Escape'&&S){modal.classList.remove('hidden');return;}
  if(keyMode==='weiter'){ if(e.key==='Enter'||e.key===' '){e.preventDefault();if(contFn)contFn();} return; }
  if(keyMode==='recall'&&/^[a-zA-Z]$/.test(e.key)){recallBuchstabe.answer(e.key.toUpperCase());return;}
  if(keyMode==='hold'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();if(showLetter.done)showLetter.done();return;}
  if(keyMode==='wahl'&&renderTask.chooseByKey){
    const m={ArrowLeft:'L',ArrowRight:'R',l:'L',r:'R',s:'S',h:'H'};
    const k=m[e.key]||m[e.key.toLowerCase()];
    if(k) renderTask.chooseByKey(k);
  }
});

renderMenu();
</script>
</body>
</html>
