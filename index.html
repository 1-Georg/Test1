function renderEvent(next){
  const arten=[];
  if(CFG.merk.buchstabe) arten.push('b');
  if(CFG.merk.instrument) arten.push('i');
  if(farbeAktiv()) arten.push('f');
  const wahl=pick(arten);
  if(wahl==='f'){
    if(CFG.stufe==='schwer'&&Math.random()<.28){
      let st=pick(FARBEN.filter(f=>f.k!==S.farbe.k));
      S.ftrace.push(`<b>${S.ftrace.length+1}</b>  ${st.n} war nur eine Störansage`);
      return showFarbe('STÖRFARBE',st,'Ablenkung ohne Gültigkeit. Die gemerkte Farbe bleibt bestehen.',4,next,true);
    }
    S.farbe=pick(FARBEN.filter(f=>f.k!==S.farbe.k));
    S.ftrace=[`<b>1</b>  Neue Ansage: <b>${S.farbe.n}</b>`];
    return showFarbe('NEUE AKTIVE FARBE',S.farbe,'Ab jetzt gilt diese Farbe. Die vorherige verfällt.',4,next);
  }
  if(wahl==='i'){
    if(CFG.stufe==='schwer'&&Math.random()<.3){
      S.wtrace.push(`<b>${S.wtrace.length+1}</b>  Störanzeige ohne Gültigkeit`);
      return showWerte('STÖRANZEIGE',randWerte(),'Ablenkung ohne Gültigkeit. Die gemerkten Werte bleiben bestehen.',4,next,true);
    }
    S.werte=randWerte();
    S.wtrace=[`<b>1</b>  Anzeige ersetzt`];
    return zeigeAnzeige('NEUE ANZEIGE',next);
  }
  const r=Math.random();
  if(CFG.stufe!=='leicht'&&r<.35){
    const step=pick([1,1,2]), dir=Math.random()<.5?1:-1, old=S.letter;
    S.letter=AZ[((AZ.indexOf(old)+dir*step)%26+26)%26];
    S.trace.push(`<b>${S.trace.length+1}</b>  ${old} um ${step} ${dir>0?'vor':'zurück'} versetzt ergibt <b>${S.letter}</b>`);
    clearTimers(); keyMode='hold'; slot.classList.add('hidden'); beep(660,180);
    view.innerHTML=`
      <div class="card letterstage">
        <div class="eyebrow">ANWEISUNG</div>
        <div class="bigletter mono" style="font-size:56px;letter-spacing:0">${step} ${dir>0?'VOR':'ZURÜCK'}</div>
        <p class="hold">Gemerkten Buchstaben um ${step} ${step===1?'Stelle':'Stellen'} ${dir>0?'nach vorn':'zurück'} versetzen. Das Ergebnis wird nicht angezeigt.</p>
        <div class="countdown mono" id="cd">6</div>
      </div>
      <button class="btn ghost" id="skip">VERSTANDEN</button>`;
    let left=6; const el=document.getElementById('cd');
    const done=()=>{clearTimers();keyMode=null;next();};
    tickId=setInterval(()=>{left--;if(el)el.textContent=left;if(left<=0)done();},1000);
    document.getElementById('skip').addEventListener('click',done);
    showLetter.done=done;
    return;
  }
  if(CFG.stufe==='schwer'&&r<.6){
    let st=pick(AZ); while(st===S.letter) st=pick(AZ);
    S.trace.push(`<b>${S.trace.length+1}</b>  ${st} ohne Gültigkeit`);
    return showLetter('STÖRSIGNAL',st,'Ablenkung ohne Gültigkeit. Der gemerkte Buchstabe bleibt bestehen.',4,next,true);
  }
  let neu=pick(AZ); while(neu===S.letter) neu=pick(AZ);
  S.letter=neu;
  S.trace=[`<b>1</b>  Neue Ansage: <b>${neu}</b>`];
  showLetter('NEUER AKTIVER BUCHSTABE',neu,'Neuer Buchstabe gültig. Der vorherige verfällt.',4,next);
}

function renderTask(){
  clearTimers();
  slot.classList.remove('hidden');
  const aktiv=KEYS.filter(k=>CFG.typen[k]);
  const art=pick(aktiv);
  if(art==='reaktion') return renderReaktion();
  if(art==='steuern') return renderSteuern();
  const q=GEN[art].fn();
  const secs=CFG.zeit ? (q.art==='wuerfel' ? Math.max(CFG.zeit,60) : CFG.zeit) : 0;
  keyMode=q.typ==='zahl'?'zahl':'wahl';
  view.innerHTML=`
    <div class="card">
      <div class="qhead">
        <span class="tag">${GEN[q.art].label}</span>
        <span class="tclock mono">BLOCK ${S.block}/${CFG.bloecke}</span>
      </div>
      <div class="question">${q.frage}</div>
      ${q.grafik||''}
      ${q.typ==='zahl'?`
        <div class="answer">
          <input id="inp" type="text" inputmode="decimal" autocomplete="off" placeholder="?">
          <button id="ok">OK</button>
        </div>
        <div class="unit">${q.einheit||''}</div>`:`
        <div class="row ${q.optionen.some(o=>o.length>9)?'stack':''} ${q.art==='wuerfel'?'sechs':''}" style="margin-top:16px">
          ${q.optionen.map(o=>`<button class="chip" style="font-size:15px;padding:16px 6px" data-v="${o}">${o}</button>`).join('')}
        </div>`}
      ${secs?`<div class="tbar" id="tb"><span id="tbf"></span></div>`:''}
    </div>
    <div id="fbHost"></div>`;

  const tAuf=Date.now();
  const finish=val=>{
    clearTimers();
    const ok=val!==null&&check(q,val);
    const c=S.cat[q.art]; c.n++;
    if(val!==null){ const dt=Date.now()-tAuf; S.rt.push(dt); c.rt.push(dt); }
    if(ok){c.ok++;S.streak++;S.best=Math.max(S.best,S.streak);beep(1050,90);}
    else {S.streak=0;beep(240,180);buzz(60);}
    const soll=q.typ==='zahl'?(q.kurs?pad3(q.loesung):(q.ziffern4?String(q.loesung).padStart(4,'0'):q.loesung)):q.loesung;
    document.getElementById('fbHost').innerHTML=`
      <div class="fb ${ok?'ok':'no'}">
        <div class="verdict">${ok?'RICHTIG':(val===null?'ZEIT ABGELAUFEN':'FALSCH')}</div>
        <div class="sol">Lösung: ${soll}${q.einheit&&q.typ==='zahl'?' '+q.einheit:''}</div>
        <ul class="weg">${(q.weg||[]).map(w=>`<li>${w}</li>`).join('')}</ul>
        <p class="tip">${q.hinweis||''}</p>
        ${q.loesungsGrafik||''}
      </div>
      <button class="btn" id="weiter">WEITER</button>`;
    document.querySelectorAll('.answer button,.row .chip,.answer input').forEach(b=>b.disabled=true);
    warteAufWeiter(nextInBlock);
  };

  if(q.typ==='zahl'){
    const inp=document.getElementById('inp');
    const send=()=>{const v=inp.value.trim(); if(v!=='') finish(v);};
    document.getElementById('ok').addEventListener('click',send);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
    setTimeout(()=>inp.focus(),60);
  } else {
    view.querySelectorAll('.row .chip').forEach(b=>b.addEventListener('click',()=>finish(b.dataset.v)));
    renderTask.chooseByKey=k=>{
      const b=[...view.querySelectorAll('.row .chip')].find(x=>!x.disabled&&x.dataset.v[0]===k);
      if(b) finish(b.dataset.v);
    };
  }
  if(secs){
    const fill=document.getElementById('tbf'), bar=document.getElementById('tb'), t0=Date.now();
    tickId=setInterval(()=>{
      const p=1-(Date.now()-t0)/(secs*1000);
      fill.style.width=Math.max(0,p*100)+'%';
      if(p<.25) bar.classList.add('low');
      if(p<=0) finish(null);
    },100);
  }
  starteNeben();
}
function check(q,val){
  if(q.typ==='wahl') return val===q.loesung;
  let n=parseFloat(String(val).replace(',','.').replace(':',''));
  if(isNaN(n)) return false;
  if(q.kurs) n=norm(n);
  return Math.abs(n-q.loesung)<0.001;
}

  const arten=[];
  if(CFG.merk.buchstabe) arten.push(recallBuchstabe);
  if(CFG.merk.farbe) arten.push(recallFarbe);

function recallWerte(next){

    <div class="card">
      <div class="eyebrow">ABFRAGE</div>
      <h2>Welche Werte zeigte die letzte gültige Anzeige?</h2>

      ${S.felder.map(f=>`<div class="frow"><label>${FELD[f].label}</label><input id="i_${f}" type="text" inputmode="numeric" autocomplete="off" placeholder="?"><span>${FELD[f].einheit}</span></div>`).join('')}

      <div class="fb ${alle?'ok':'no'}">

        <ul class="weg">${zeilen.concat(S.wtrace).map(w=>`<li>${w}</li>`).join('')}</ul>

function bewertung(){
  const q=o=>o.n?o.ok/o.n:null;
  const merk={ok:S.rc.ok+S.ri.ok+S.rf.ok, n:S.rc.n+S.ri.n+S.rf.n};
  let aufg={ok:0,n:0}; KEYS.forEach(k=>{aufg.ok+=S.cat[k].ok; aufg.n+=S.cat[k].n;});
  const M=q(merk), A=q(aufg), D=q(S.dual);
  let g=0, w=0;
  const add=(v,gew)=>{ if(v!==null){ g+=v*gew; w+=gew; } };
  add(M, D!==null?.55:.62); add(A, D!==null?.30:.38); add(D,.15);
  const Q = w?g/w:0;

  const rt=med(S.rt)/1000;
  const T = rt>0 ? Math.min(1.4, Math.max(.7, 1+.4*(1-rt/15))) : 1;

  const fStufe={leicht:1, mittel:1.25, schwer:1.55}[CFG.stufe];
  const fZeit={0:1, 45:1.05, 30:1.12, 20:1.2}[CFG.zeit]||1;
  let el=0;
  if(CFG.merk.buchstabe) el++;
  if(farbeAktiv()) el++;
  if(CFG.merk.instrument) el+=S.felder.length;
  const fMerk=1+.12*Math.max(0,el-1);
  const fDichte={wenig:.94, normal:1, viel:1.08}[CFG.dichte];
  const fDoppel=CFG.doppel?1.15:1;
  const fBreite=1+.02*Math.max(0, KEYS.filter(k=>CFG.typen[k]).length-2);
  const SF=fStufe*fZeit*fMerk*fDichte*fDoppel*fBreite;

  // Punkte auf fester Skala bis 1000. Maximal möglicher Schwierigkeitsfaktor ist rund 4.0
  // Die Quote geht überproportional ein, damit eine hohe Stufe bei vielen Fehlern
  // nicht mehr einbringt als eine saubere Leistung auf niedriger Stufe
  const punkte=Math.min(1000, Math.round(Math.pow(Q,1.7)*T*SF/4.8*1000));
  return {Q:Q, M:M, A:A, D:D, T:T, SF:SF, el:el, posten:merk.n+aufg.n+S.dual.n,
          index:Math.round(Q*T*SF*100), punkte:punkte};
}
function rang(p){
  if(p>=800) return {n:'AUSNAHME', f:'#c07bff'};
  if(p>=650) return {n:'SEHR STARK', f:'#3ddc84'};
  if(p>=500) return {n:'STARK', f:'#3ddc84'};
  if(p>=350) return {n:'SOLIDE', f:'#ffb020'};
  if(p>=200) return {n:'AUFBAU', f:'#ffb020'};
  return {n:'EINSTIEG', f:'#6b7d92'};
}
function tipps(B){
  const t=[];
  if(B.M!==null && B.M<.8) t.push('Merkabfragen zählen am stärksten. Jeder richtige Buchstabe, jede Farbe und jeder Instrumentenwert bringt am meisten.');
  if(B.T<1.05) t.push('Schneller antworten. Unter 15 Sekunden je Aufgabe steigen die Punkte, unter 8 Sekunden deutlich.');
  if(CFG.stufe!=='schwer') t.push('Eine Stufe höher zählt jede Antwort mehr wert, mittel bringt ein Viertel mehr, schwer gut die Hälfte.');
  if(CFG.zeit===0) t.push('Eine Zeitvorgabe einschalten erhöht den Wert jeder Antwort um bis zu ein Fünftel.');
  if(B.el<4) t.push('Mehr gleichzeitig merken. Jedes zusätzliche Element bringt zwölf Prozent mehr Wert.');
  if(!CFG.doppel) t.push('Die Doppelaufgabe einschalten bringt fünfzehn Prozent mehr Wert.');
  if(B.D!==null && B.D<.7) t.push('Fehlgriffe bei den Kreisen kosten wie verpasste Ziele. Im Zweifel nicht tippen.');
  return t.slice(0,3);
}
function renderResults(){
  clearTimers(); keyMode=null; contFn=null;
  slot.classList.add('hidden'); menuBtn.classList.add('hidden'); prog.style.width='100%';
  const pc=o=>o.n?Math.round(o.ok/o.n*100):0;
  const B=bewertung(), R=rang(B.punkte);
  const total=Math.round(B.Q*100);
  const dauer=Math.round((Date.now()-S.t0)/60000);
  const rtA=med(S.rt), rtB=med(S.rtAbruf);
  const alt=ladeVerlauf();
  const vorPunkte=alt.map(r=>r.punkte!==undefined?r.punkte:Math.round((r.idx!==undefined?r.idx:r.gesamt)/4));
  const letzter=vorPunkte.length?vorPunkte[vorPunkte.length-1]:null;
  const letzte5=vorPunkte.slice(-5);
  const schnitt5=letzte5.length?Math.round(letzte5.reduce((a,b)=>a+b,0)/letzte5.length):null;
  const bestAlt=vorPunkte.length?Math.max.apply(null,vorPunkte):null;
  speichereLauf({t:Date.now(), stufe:CFG.stufe, bloecke:CFG.bloecke, gesamt:total, merk:pc({ok:S.rc.ok+S.ri.ok+S.rf.ok,n:S.rc.n+S.ri.n+S.rf.n}),
                 ablese:S.ab.n?pc(S.ab):null, rt:rtA, dauer:dauer,
                 idx:B.index, punkte:B.punkte, sf:Math.round(B.SF*100)/100, doppel:CFG.doppel});
  const d = letzter===null?null:B.punkte-letzter;
  const dS = schnitt5===null?null:B.punkte-schnitt5;
  const rekord = bestAlt!==null && B.punkte>bestAlt;
  const bal=(v)=>`<i style="width:${Math.round((v||0)*100)}%"></i>`;
  const zeilen=KEYS.filter(k=>S.cat[k].n>0).map(k=>
    `<div class="stat"><span class="k">${GEN[k].label.charAt(0)+GEN[k].label.slice(1).toLowerCase()}</span><span class="v">${S.cat[k].ok}/${S.cat[k].n} · ${pc(S.cat[k])}%${S.cat[k].rt.length?' · '+(med(S.cat[k].rt)/1000).toFixed(1)+' s':''}</span></div>`).join('');
  const T=tipps(B);
  view.innerHTML=`
    <div class="eyebrow">AUSWERTUNG</div>
    <h1>Lauf beendet</h1>

    <div class="card" style="text-align:center">
      <div class="num mono" style="font-size:64px;font-weight:700;color:${R.f};line-height:1">${B.punkte}</div>
      <div class="lbl" style="font-size:11px;letter-spacing:3px;color:var(--dim);margin-top:4px">PUNKTE VON 1000</div>
      <div class="rangname" style="color:${R.f}">${R.n}${rekord?' · BESTWERT':''}</div>
      <div class="skala"><span style="width:${Math.max(2,B.punkte/10)}%;background:${R.f}"></span></div>
      <div class="skalatext"><span>0</span><span>250</span><span>500</span><span>750</span><span>1000</span></div>
      ${d===null?'<p class="sub" style="margin-top:12px;font-size:13px">Erster gespeicherter Lauf. Ab jetzt siehst du hier den Vergleich.</p>'
        :`<div class="delta ${d>0?'up':d<0?'down':'flat'}">${d>0?'+':''}${d} zum letzten Lauf</div>
          ${dS!==null&&letzte5.length>1?`<p class="sub" style="margin-top:8px;font-size:13px">${dS>0?'Über':dS<0?'Unter':'Genau auf'} deinem Schnitt der letzten ${letzte5.length} Läufe von ${schnitt5}${dS!==0?' um '+Math.abs(dS)+' Punkte':''}.</p>`:''}`}
    </div>

    ${vorPunkte.length?`<div class="card">
      <div class="opt">Deine letzten Läufe</div>
      ${miniChart(vorPunkte.concat([B.punkte]))}
    </div>`:''}

    <div class="card">
      <div class="opt">Woraus die Punkte entstehen</div>
      ${B.M!==null?`<div class="beitrag"><span class="nm">Gemerktes</span><span class="bal">${bal(B.M)}</span><span class="vl">${Math.round(B.M*100)}%</span></div>`:''}
      ${B.A!==null?`<div class="beitrag"><span class="nm">Aufgaben</span><span class="bal">${bal(B.A)}</span><span class="vl">${Math.round(B.A*100)}%</span></div>`:''}
      ${B.D!==null?`<div class="beitrag"><span class="nm">Nebenaufgabe</span><span class="bal">${bal(B.D)}</span><span class="vl">${Math.round(B.D*100)}%</span></div>`:''}
      <div class="beitrag" style="margin-top:14px"><span class="nm">Tempo</span><span class="bal">${bal((B.T-.7)/.7)}</span><span class="vl">×${B.T.toFixed(2)}</span></div>
      <div class="beitrag"><span class="nm">Schwierigkeit</span><span class="bal">${bal(B.SF/4.8)}</span><span class="vl">×${B.SF.toFixed(2)}</span></div>
      <p class="sub" style="margin-top:12px;font-size:13px">Die Trefferquoten werden zusammengezogen, dann mit Tempo und Schwierigkeit multipliziert. 1000 Punkte bedeuten fehlerfrei, sehr schnell und auf der schwersten Einstellung.</p>
    </div>

    ${T.length?`<div class="card">
      <div class="opt">So holst du mehr Punkte</div>
      <ul class="tippliste">${T.map(x=>`<li>${x}</li>`).join('')}</ul>
    </div>`:''}

    <div class="card">
      <div class="opt">Einzelheiten</div>
      ${S.rc.n?`<div class="stat"><span class="k">Buchstabe erinnert</span><span class="v" style="color:var(--amber)">${S.rc.ok}/${S.rc.n} · ${pc(S.rc)}%</span></div>`:''}
      ${S.rf.n?`<div class="stat"><span class="k">Farbe erinnert</span><span class="v" style="color:var(--amber)">${S.rf.ok}/${S.rf.n} · ${pc(S.rf)}%</span></div>`:''}
      ${S.ri.n?`<div class="stat"><span class="k">Instrumentenwerte erinnert</span><span class="v" style="color:var(--amber)">${S.ri.ok}/${S.ri.n} · ${pc(S.ri)}%</span></div>`:''}
      ${S.ab.n?`<div class="stat"><span class="k">Ablesung an der Anzeige</span><span class="v">${S.ab.ok}/${S.ab.n} · ${pc(S.ab)}%</span></div>`:''}
      ${zeilen}
      ${S.dual.n?`<div class="stat"><span class="k">Nebenaufgabe</span><span class="v">${S.dual.ok}/${S.dual.n} · ${pc(S.dual)}% · ${S.dual.rt.length?med(S.dual.rt):0} ms</span></div>`:''}
      ${S.dual.fehl?`<div class="stat"><span class="k">Fehlgriffe nebenbei</span><span class="v" style="color:var(--red)">${S.dual.fehl}</span></div>`:''}
      <div class="stat"><span class="k">Reaktionszeit je Aufgabe</span><span class="v">${(rtA/1000).toFixed(1)} s</span></div>
      <div class="stat"><span class="k">Abrufzeit bei der Abfrage</span><span class="v">${(rtB/1000).toFixed(1)} s</span></div>
      <div class="stat"><span class="k">Längste Serie</span><span class="v">${S.best}</span></div>
      <div class="stat"><span class="k">Stufe und Dauer</span><span class="v">${CFG.stufe.toUpperCase()} · ${dauer} min</span></div>
      ${B.posten<20?`<p class="sub" style="margin-top:10px;font-size:12px">Nur ${B.posten} gewertete Posten. Kurze Läufe schwanken stark, für den Verlauf sind mindestens acht Blöcke sinnvoll.</p>`:''}
      ${S.ab.n&&pc(S.ab)<pc(S.ri)+1&&S.ri.n?`<p class="sub" style="margin-top:8px;font-size:12px">Ein Teil der Fehler entsteht bereits beim Ablesen, nicht erst beim Merken.</p>`:''}
    </div>

    <button class="btn" id="again">NEUER LAUF</button>
    <button class="btn ghost" id="hist">VOLLER VERLAUF</button>
    <button class="btn ghost" id="home">HAUPTMENÜ</button>`;
  document.getElementById('again').addEventListener('click',startSession);
  document.getElementById('hist').addEventListener('click',renderVerlauf);
  document.getElementById('home').addEventListener('click',renderMenu);
}
function miniChart(p){
  const v=p.slice(-12), W=320, H=96, px=6, pt=8, pb=8;
  const n=v.length, top=Math.max(200,Math.ceil(Math.max.apply(null,v)/100)*100);
  const xs=i=>px+(W-px*2)*(n<2?0:i/(n-1)), y=x=>pt+(H-pt-pb)*(1-x/top);
  const flaeche=n>1?`<polygon points="${v.map((x,i)=>xs(i)+','+y(x)).join(' ')} ${xs(n-1)},${H-pb} ${xs(0)},${H-pb}" fill="rgba(255,176,32,.16)"/>`:'';
  const linie=n>1?`<polyline fill="none" stroke="#ffb020" stroke-width="2" stroke-linejoin="round" points="${v.map((x,i)=>xs(i)+','+y(x)).join(' ')}"/>`:'';
  const punkte=v.map((x,i)=>`<circle cx="${xs(i)}" cy="${y(x)}" r="${i===n-1?4:2.5}" fill="${i===n-1?'#ffffff':'#ffb020'}"/>`).join('');
  const letzterWert=v[n-1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;margin-top:8px">
    <line x1="${px}" y1="${H-pb}" x2="${W-px}" y2="${H-pb}" stroke="#1e2b3a"/>
    ${flaeche}${linie}${punkte}</svg>
    <div class="skalatext"><span>vor ${n-1} ${n-1===1?'Lauf':'Läufen'}</span><span>dieser Lauf ${letzterWert}</span></div>`;
}
function verlaufChart(v){
  const W=320,H=132,px=28,pb=18,pt=10;
  const n=v.length, xs=i=>px+(W-px-12)*(n<2?0:i/(n-1));
  const p=v.map(r=>r.punkte!==undefined?r.punkte:Math.round((r.idx!==undefined?r.idx:r.gesamt)/4));
  const top=Math.max(200,Math.ceil(Math.max.apply(null,p)/200)*200);
  const y=x=>pt+(H-pt-pb)*(1-x/top);
  let grid='';
  [0,top/2,top].forEach(g=>{ grid+=`<line x1="${px}" y1="${y(g)}" x2="${W-12}" y2="${y(g)}" stroke="#1e2b3a" stroke-width="1"/>
    <text x="${px-5}" y="${y(g)+3}" fill="#6b7d92" font-size="8" text-anchor="end" font-family="var(--mono)">${g}</text>`; });
  // gleitender Schnitt über drei Läufe
  let sn='';
  if(n>=3){
    const gl=p.map((_,i)=>{ const a=Math.max(0,i-2), t=p.slice(a,i+1); return t.reduce((x,z)=>x+z,0)/t.length; });
    sn=`<polyline fill="none" stroke="#4fd6e0" stroke-width="1.6" stroke-dasharray="4 3" points="${gl.map((x,i)=>xs(i)+','+y(x)).join(' ')}"/>`;
  }
  const flaeche=n>1?`<polygon points="${p.map((x,i)=>xs(i)+','+y(x)).join(' ')} ${xs(n-1)},${y(0)} ${xs(0)},${y(0)}" fill="rgba(255,176,32,.16)"/>`:'';
  const linie=n>1?`<polyline fill="none" stroke="#ffb020" stroke-width="2" stroke-linejoin="round" points="${p.map((x,i)=>xs(i)+','+y(x)).join(' ')}"/>`:'';
  const punkte=v.map((r,i)=>`<circle cx="${xs(i)}" cy="${y(p[i])}" r="2.6" fill="${r.stufe==='schwer'?'#ff5c5c':r.stufe==='mittel'?'#ffb020':'#4fd6e0'}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${grid}${flaeche}${sn}${linie}${punkte}</svg>
    <p class="sub" style="font-size:12px;margin-top:6px">Punkte je Lauf. Die gestrichelte Linie ist der Schnitt der letzten drei Läufe. Punktfarbe zeigt die Stufe: türkis leicht, gelb mittel, rot schwer.</p>`;
}
function renderVerlauf(){
  clearTimers(); keyMode=null; contFn=null;
  slot.classList.add('hidden'); menuBtn.classList.add('hidden'); prog.style.width='0%';
  const v=ladeVerlauf();
  if(!v.length){
    view.innerHTML=`<div class="eyebrow">VERLAUF</div><h1>Keine Daten</h1>
      <p class="sub" style="margin-top:8px">${SPEICHER_OK?'Nach dem ersten abgeschlossenen Lauf erscheinen hier Punkte und Trefferquote über die Zeit.':'Der Speicher des Browsers ist nicht verfügbar. In der installierten Anwendung auf dem Startbildschirm funktioniert die Aufzeichnung.'}</p>
      <button class="btn ghost" id="back">ZURÜCK</button>`;
    document.getElementById('back').addEventListener('click',renderMenu); return;
  }
  const p=v.map(r=>r.punkte!==undefined?r.punkte:Math.round((r.idx!==undefined?r.idx:r.gesamt)/4));
  const best=Math.max.apply(null,p), R=rang(best);
  const schnitt=Math.round(p.reduce((a,b)=>a+b,0)/p.length);
  const l5=p.slice(-5), form=Math.round(l5.reduce((a,b)=>a+b,0)/l5.length);
  const f5=p.slice(-5), v5=p.slice(-10,-5);
  const trend = v5.length ? form-Math.round(v5.reduce((a,b)=>a+b,0)/v5.length) : null;
  const letzte=v.slice(-6).reverse();
  view.innerHTML=`
    <div class="eyebrow">VERLAUF</div>
    <h1>${v.length} ${v.length===1?'Lauf':'Läufe'}</h1>
    <div class="card">${verlaufChart(v)}</div>
    <div class="card">
      <div class="stat"><span class="k">Bestwert</span><span class="v" style="color:${R.f}">${best} · ${R.n}</span></div>
      <div class="stat"><span class="k">Form der letzten fünf</span><span class="v">${form}</span></div>
      ${trend!==null?`<div class="stat"><span class="k">Gegenüber den fünf davor</span><span class="v" style="color:${trend>0?'var(--green)':trend<0?'var(--red)':'var(--dim)'}">${trend>0?'+':''}${trend}</span></div>`:''}
      <div class="stat"><span class="k">Durchschnitt gesamt</span><span class="v">${schnitt}</span></div>
      <div class="stat"><span class="k">Beste Trefferquote</span><span class="v">${Math.max.apply(null,v.map(r=>r.gesamt))}%</span></div>
      <div class="stat"><span class="k">Schnellste Reaktionszeit</span><span class="v">${(Math.min.apply(null,v.map(r=>r.rt||99999))/1000).toFixed(1)} s</span></div>
    </div>
    <div class="card">
      <div class="opt">Letzte Läufe</div>
      ${letzte.map(r=>{const pp=r.punkte!==undefined?r.punkte:Math.round((r.idx!==undefined?r.idx:r.gesamt)/4);
        return `<div class="stat"><span class="k">${datum(r.t)} · ${r.stufe}${r.doppel?' · doppelt':''}</span><span class="v">${pp} Punkte · ${r.gesamt}%</span></div>`;}).join('')}
    </div>
    <div class="card">
      <div class="opt">Die Punkteskala</div>
      <div class="stat"><span class="k" style="color:#6b7d92">unter 200</span><span class="v" style="color:#6b7d92">EINSTIEG</span></div>
      <div class="stat"><span class="k" style="color:#ffb020">ab 200</span><span class="v" style="color:#ffb020">AUFBAU</span></div>
      <div class="stat"><span class="k" style="color:#ffb020">ab 350</span><span class="v" style="color:#ffb020">SOLIDE</span></div>
      <div class="stat"><span class="k" style="color:#3ddc84">ab 500</span><span class="v" style="color:#3ddc84">STARK</span></div>
      <div class="stat"><span class="k" style="color:#3ddc84">ab 650</span><span class="v" style="color:#3ddc84">SEHR STARK</span></div>
      <div class="stat"><span class="k" style="color:#c07bff">ab 800</span><span class="v" style="color:#c07bff">AUSNAHME</span></div>
      <p class="sub" style="margin-top:10px;font-size:13px">Punkte entstehen aus der Trefferquote, dem Tempo und der gewählten Schwierigkeit. Fehlerfrei auf der leichtesten Einstellung ergibt etwa 240 Punkte, fehlerfrei auf der schwersten rund 1000.</p>
    </div>
    <button class="btn ghost" id="back">ZURÜCK</button>
    <button class="btn ghost" id="clr" style="color:var(--red);border-color:var(--red)">VERLAUF LÖSCHEN</button>`;
  document.getElementById('back').addEventListener('click',renderMenu);
  document.getElementById('clr').addEventListener('click',()=>{ loescheVerlauf(); renderVerlauf(); });
}

/* Menütaste und Tastatur */
menuBtn.addEventListener('click',()=>modal.classList.remove('hidden'));
document.getElementById('mNo').addEventListener('click',()=>modal.classList.add('hidden'));
document.getElementById('mYes').addEventListener('click',()=>{modal.classList.add('hidden');renderMenu();});
document.addEventListener('keydown',e=>{
  if(!modal.classList.contains('hidden')) return;
  if(e.key==='Escape'&&S){modal.classList.remove('hidden');return;}
  if(keyMode==='weiter'){ if(e.key==='Enter'||e.key===' '){e.preventDefault();if(contFn)contFn();} return; }
  if(keyMode==='recall'&&/^[a-zA-Z]$/.test(e.key)){recallBuchstabe.answer(e.key.toUpperCase());return;}
  if(keyMode==='hold'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();if(showLetter.done)showLetter.done();return;}
  if(keyMode==='wahl'&&renderTask.chooseByKey){
    const m={ArrowLeft:'L',ArrowRight:'R',l:'L',r:'R',s:'S',h:'H'};
    const k=m[e.key]||m[e.key.toLowerCase()];
    if(k) renderTask.chooseByKey(k);
  }
});

renderMenu();
</script>
