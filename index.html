<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memory Ops">
<meta name="theme-color" content="#0a0e14">
<title>Memory Ops</title>
<style>
:root{
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Roboto Mono',monospace;
  --bg:#0a0e14; --panel:#111823; --panel2:#16202d; --line:#1e2b3a;
  --amber:#ffb020; --amber-dim:#6b4a13; --cyan:#4fd6e0; --green:#3ddc84;
  --red:#ff5c5c; --text:#dbe3ec; --dim:#6b7d92;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #13202e 0%, transparent 60%), var(--bg);
  color:var(--text); font-family:var(--sans);
  overflow:hidden; display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  user-select:none;
}
.mono{font-family:var(--mono)}

.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-size:13px;letter-spacing:3px;color:var(--dim);font-weight:600}
.brand b{color:var(--amber)}
.spacer{flex:1}
.slot{display:flex;align-items:center;gap:7px;border:1px solid var(--amber-dim);border-radius:6px;padding:4px 9px;background:rgba(255,176,32,.06)}
.slot .lbl{font-size:9px;letter-spacing:2px;color:var(--amber);opacity:.75}
.slot .box{width:17px;height:21px;border-radius:3px;background:repeating-linear-gradient(135deg,#3a2a08 0 3px,#22190a 3px 6px);box-shadow:inset 0 0 6px rgba(0,0,0,.7);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;color:rgba(255,176,32,.75)}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:13px;letter-spacing:1px;font-weight:600;cursor:pointer}
.iconbtn:active{background:var(--panel2)}
.progress{height:3px;background:#121a25;flex:0 0 auto}
.progress span{display:block;height:100%;background:var(--amber);width:0;transition:width .35s ease}

.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 16px 26px;-webkit-overflow-scrolling:touch}
.wrap{max-width:520px;margin:0 auto;width:100%}
h1{font-size:30px;font-weight:700;letter-spacing:1px;line-height:1.1}
h2{font-size:19px;font-weight:600;letter-spacing:.5px;margin-bottom:4px}
.sub{color:var(--dim);font-size:14px;line-height:1.55}
.eyebrow{font-size:10px;letter-spacing:3px;color:var(--amber);font-weight:700;margin-bottom:6px}
.card{background:linear-gradient(180deg,var(--panel) 0%,#0e151f 100%);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.chip{flex:1 1 0;min-width:74px;text-align:center;cursor:pointer;border:1px solid var(--line);background:#0d141d;color:var(--dim);border-radius:10px;padding:11px 6px;font-family:inherit;font-size:14px;font-weight:600}
.chip.on{border-color:var(--amber);color:var(--amber);background:rgba(255,176,32,.09)}
.row.stack{flex-direction:column}
.row.stack .chip{width:100%;flex:none;text-align:left;padding-left:16px}
.chip small{display:block;font-size:10px;letter-spacing:1px;opacity:.7;font-weight:400;margin-top:2px}
.opt{font-size:11px;letter-spacing:2px;color:var(--dim);margin-bottom:2px;text-transform:uppercase}
.btn{width:100%;border:none;border-radius:12px;padding:16px;margin-top:16px;font-family:inherit;font-size:17px;font-weight:700;letter-spacing:2px;background:var(--amber);color:#141005;cursor:pointer}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}

.letterstage{text-align:center;padding:26px 0 6px}
.bigletter{font-size:112px;line-height:1;font-weight:700;color:var(--amber);text-shadow:0 0 46px rgba(255,176,32,.45);letter-spacing:4px;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.nato{margin-top:8px;font-size:15px;letter-spacing:7px;color:var(--dim);font-weight:600}
.hold{margin-top:20px;font-size:14px;color:var(--dim);line-height:1.5}
.countdown{margin-top:18px;font-size:13px;letter-spacing:3px;color:var(--amber)}
.warn{border-color:var(--red);background:rgba(255,92,92,.07)}
.warn .bigletter{color:var(--red);text-shadow:0 0 46px rgba(255,92,92,.35)}
.warn .eyebrow{color:var(--red)}

.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tag{font-size:10px;letter-spacing:2px;color:var(--cyan);font-weight:700}
.tclock{font-size:13px;color:var(--dim)}
.question{font-size:20px;line-height:1.45;font-weight:600}
.tbar{height:4px;background:#121a25;border-radius:2px;margin-top:14px;overflow:hidden}
.tbar span{display:block;height:100%;background:var(--cyan);width:100%}
.tbar.low span{background:var(--red)}
.answer{display:flex;gap:8px;margin-top:16px}
.answer input{flex:1;background:#0b1119;border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:22px;padding:13px 14px;text-align:center;letter-spacing:2px;outline:none;min-width:0}
.answer input:focus{border-color:var(--amber)}
.answer button{border:none;border-radius:10px;background:var(--amber);color:#141005;font-family:inherit;font-weight:700;font-size:15px;padding:0 20px;letter-spacing:1px;cursor:pointer}
.unit{text-align:center;color:var(--dim);font-size:12px;margin-top:8px;letter-spacing:1px}

.rose{fill:none;stroke:#26384a;stroke-width:1}
.tick{stroke:#3b5266}
.tickmaj{stroke:#7d97ad}
.roselbl{fill:#7d97ad;font-family:var(--mono);font-size:9px;text-anchor:middle}
.needle{stroke:var(--amber);stroke-width:3;stroke-linecap:round}
.compass{display:block;margin:14px auto 2px}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:300px;margin:16px auto 4px}
.gauge{width:100%;display:block}
.gname{text-align:center;font-size:9px;letter-spacing:2px;color:var(--dim);margin-top:3px}
.dial{fill:#080d13;stroke:#2b3d50;stroke-width:1.5}
.dlbl{fill:#9fb3c6;font-family:var(--mono);font-size:8px;text-anchor:middle;dominant-baseline:middle}

.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:14px}
.grid button{aspect-ratio:1/1;border:1px solid var(--line);background:#0d141d;color:var(--text);border-radius:9px;font-family:var(--mono);font-size:17px;font-weight:700;cursor:pointer}
.grid button:active{background:var(--amber);color:#141005}

.frow{display:flex;align-items:center;gap:10px;margin-top:10px}
.frow label{width:64px;font-size:11px;letter-spacing:2px;color:var(--amber);font-weight:700}
.frow input{flex:1;min-width:0;background:#0b1119;border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:20px;padding:12px 10px;text-align:center;letter-spacing:2px;outline:none}
.frow input:focus{border-color:var(--amber)}
.frow span{width:58px;font-size:11px;color:var(--dim)}
.fb{margin-top:16px;border-radius:12px;padding:14px 15px;font-size:15px;line-height:1.5;border:1px solid;animation:pop .2s ease}
.fb.ok{border-color:var(--green);background:rgba(61,220,132,.08)}
.fb.no{border-color:var(--red);background:rgba(255,92,92,.08)}
.fb .verdict{font-weight:700;letter-spacing:.5px}
.fb.ok .verdict{color:var(--green)}
.fb.no .verdict{color:var(--red)}
.fb .sol{margin-top:6px;font-family:var(--mono);font-size:17px;font-weight:700;color:var(--text)}
.weg{list-style:none;margin-top:12px;border-left:2px solid var(--line);padding-left:12px}
.weg li{font-family:var(--mono);font-size:13px;line-height:1.75;color:var(--dim)}
.weg li b{color:var(--text);font-weight:700}
.tip{margin-top:10px;font-size:13px;color:var(--dim);line-height:1.5}

.stat{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
.stat .k{color:var(--dim);font-size:14px}
.stat .v{font-family:var(--mono);font-size:16px;font-weight:700}
.bar{height:6px;background:#121a25;border-radius:3px;margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--amber)}
.score{text-align:center;padding:8px 0 4px}
.score .num{font-size:64px;font-weight:700;color:var(--amber);line-height:1}
.score .lbl{font-size:11px;letter-spacing:3px;color:var(--dim);margin-top:4px}

.modal{position:fixed;inset:0;background:rgba(4,7,11,.82);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:340px;width:100%}
.hidden{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><b>MEMORY</b> OPS</div>
  <div class="spacer"></div>
  <div class="slot hidden" id="slot"><span class="lbl">SPEICHER</span><span class="box"></span></div>
  <button class="iconbtn hidden" id="menuBtn">MENÜ</button>
</div>
<div class="progress"><span id="prog"></span></div>
<div class="view"><div class="wrap" id="view"></div></div>

<div class="modal hidden" id="modal">
  <div class="box">
    <h2>Lauf abbrechen</h2>
    <p class="sub">Der aktuelle Lauf wird verworfen und die Ergebnisse gehen verloren.</p>
    <button class="btn" id="mYes">ABBRECHEN UND ZURÜCK</button>
    <button class="btn ghost" id="mNo">WEITER TRAINIEREN</button>
  </div>
</div>

<script>
"use strict";

const view=document.getElementById('view'), slot=document.getElementById('slot'),
      menuBtn=document.getElementById('menuBtn'), prog=document.getElementById('prog'),
      modal=document.getElementById('modal');

const NATO={A:'ALFA',B:'BRAVO',C:'CHARLIE',D:'DELTA',E:'ECHO',F:'FOXTROT',G:'GOLF',H:'HOTEL',
I:'INDIA',J:'JULIETT',K:'KILO',L:'LIMA',M:'MIKE',N:'NOVEMBER',O:'OSCAR',P:'PAPA',Q:'QUEBEC',
R:'ROMEO',S:'SIERRA',T:'TANGO',U:'UNIFORM',V:'VICTOR',W:'WHISKEY',X:'XRAY',Y:'YANKEE',Z:'ZULU'};
const AZ=Object.keys(NATO);

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pad3=n=>String(n).padStart(3,'0');
const norm=h=>{h=((h%360)+360)%360;return h===0?360:h;};
let uid=0;

let CFG={bloecke:8, dichte:'normal', zeit:30, stufe:'mittel', ton:true,
         typen:{dreisatz:true, nav:true, flug:true, instr:true, reihe:false, englisch:true},
         merk:{buchstabe:true, instrument:true}, ablese:true};
let S=null, tickId=null, keyMode=null, contFn=null;

function clearTimers(){ if(tickId){clearInterval(tickId);tickId=null;} }
function beep(f,d){
  if(!CFG.ton) return;
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=beep.ctx||(beep.ctx=new C());
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=f; g.gain.value=.06;
    o.connect(g); g.connect(ctx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+d/1000);
    o.stop(ctx.currentTime+d/1000);
  }catch(e){}
}
function buzz(m){ if(navigator.vibrate) try{navigator.vibrate(m);}catch(e){} }
function med(a){ if(!a||!a.length) return 0; const b=a.slice().sort((x,y)=>x-y), i=Math.floor(b.length/2);
  return b.length%2?b[i]:Math.round((b[i-1]+b[i])/2); }
const LS='memops_verlauf_v1';
let SPEICHER_OK=true;
try{ localStorage.setItem(LS+'_t','1'); localStorage.removeItem(LS+'_t'); }catch(e){ SPEICHER_OK=false; }
function ladeVerlauf(){ try{ const r=localStorage.getItem(LS); return r?JSON.parse(r):[]; }catch(e){ return []; } }
function speichereLauf(l){ try{ const v=ladeVerlauf(); v.push(l); while(v.length>60) v.shift();
  localStorage.setItem(LS,JSON.stringify(v)); }catch(e){} }
function loescheVerlauf(){ try{ localStorage.removeItem(LS); }catch(e){} }
function datum(t){ const d=new Date(t);
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'. '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

/* =========================================================
   1  DREISATZ
   ========================================================= */
function genDreisatz(){
  const anti=(CFG.stufe==='schwer'&&Math.random()<.4)||(CFG.stufe==='mittel'&&Math.random()<.28);
  if(anti){
    const w=rnd(2,8); let c=rnd(2,9); while(c===w) c=rnd(2,9);
    const q=CFG.stufe==='schwer'?rnd(3,14):rnd(2,8);
    const t=c*q, ans=w*q;
    const T=pick([
      {f:`${w} Techniker warten eine Anlage in ${t} Stunden. Wie lange brauchen ${c} Techniker?`,u:'Stunden'},
      {f:`${w} Pumpen füllen den Tank in ${t} Minuten. Wie lange brauchen ${c} Pumpen?`,u:'Minuten'},
      {f:`${w} Generatoren decken den Bedarf ${t} Tage lang. Wie lange reichen ${c} Generatoren?`,u:'Tage'}
    ]);
    return {art:'dreisatz',frage:T.f,einheit:T.u,typ:'zahl',loesung:ans,
      weg:[`<b>1</b>  Gesamtaufwand: ${w} × ${t} = ${w*t}`,
           `<b>2</b>  Auf ${c} verteilt: ${w*t} ÷ ${c} = <b>${ans}</b>`],
      hinweis:'Umgekehrt proportional. Das Produkt aus Menge und Zeit bleibt konstant.'};
  }
  const u=CFG.stufe==='leicht'?rnd(2,12):CFG.stufe==='mittel'?rnd(4,35):rnd(6,85);
  const a=rnd(2,9); let c=rnd(2,15); while(c===a) c=rnd(2,15);
  const b=a*u, ans=c*u;
  const T=pick([
    {f:`${a} Solarmodule liefern ${b} Watt. Wie viel liefern ${c} Module?`,u:'Watt'},
    {f:`${a} Liter Kraftstoff reichen für ${b} Kilometer. Wie weit reichen ${c} Liter?`,u:'Kilometer'},
    {f:`${a} Werkzeugsätze kosten ${b} Euro. Was kosten ${c} Sätze?`,u:'Euro'},
    {f:`In ${a} Minuten legt der Hubschrauber ${b} Kilometer zurück. Wie weit in ${c} Minuten?`,u:'Kilometer'},
    {f:`${a} Akkuzellen speichern ${b} Wattstunden. Wie viel speichern ${c} Zellen?`,u:'Wattstunden'},
    {f:`${a} Rotorblätter wiegen ${b} Kilogramm. Wie viel wiegen ${c} Blätter?`,u:'Kilogramm'}
  ]);
  return {art:'dreisatz',frage:T.f,einheit:T.u,typ:'zahl',loesung:ans,
    weg:[`<b>1</b>  Je Einheit: ${b} ÷ ${a} = ${u}`,
         `<b>2</b>  Für ${c} Einheiten: ${u} × ${c} = <b>${ans}</b>`],
    hinweis:'Zuerst auf eine Einheit herunterrechnen, anschließend hochrechnen.'};
}

/* =========================================================
   2  NAVIGATION
   ========================================================= */
function randHdg(){
  if(CFG.stufe==='leicht') return norm(rnd(1,36)*10);
  if(CFG.stufe==='mittel') return norm(rnd(1,72)*5);
  return norm(rnd(1,360));
}
function kursWeg(raw){
  const n=norm(raw);
  if(raw>360) return `<b>+</b>  Über 360 hinaus: ${raw} minus 360 = <b>${pad3(n)}</b>`;
  if(raw<1)   return `<b>+</b>  Unter 001: ${raw} plus 360 = <b>${pad3(n)}</b>`;
  return null;
}
function drehWeg(h,t,ans){
  const m=((t-h)%360+360)%360;
  return [`<b>1</b>  Rechtsherum von ${pad3(h)} nach ${pad3(t)}: ${m} Grad`,
          `<b>2</b>  Linksherum: 360 minus ${m} = ${360-m} Grad`,
          `<b>3</b>  Kürzere Seite: <b>${ans}</b>`];
}
function genNav(){
  const art=pick(CFG.stufe==='leicht'?['turn','rezi','radial']:['turn','rezi','radial','delta','side','rel']);
  const h=randHdg();
  if(art==='turn'){
    const grad=CFG.stufe==='leicht'?rnd(1,17)*10:rnd(1,35)*5;
    const rechts=Math.random()<.5, raw=h+(rechts?grad:-grad), ans=norm(raw);
    const base=`<b>1</b>  ${pad3(h)} ${rechts?'plus':'minus'} ${grad}`, w2=kursWeg(raw);
    return {art:'nav',frage:`Anfangskurs ${pad3(h)}. Drehung um ${grad} Grad nach ${rechts?'rechts':'links'}. Wie lautet der neue Kurs?`,
      einheit:'Grad',typ:'zahl',kurs:true,grafik:compass(h),loesungsGrafik:compass(h,ans),loesung:ans,
      weg:w2?[`${base} = ${raw}`,w2]:[`${base} = <b>${pad3(ans)}</b>`],
      hinweis:'Rechtsdrehung addieren, Linksdrehung abziehen.'};
  }
  if(art==='rezi'||art==='radial'){
    const raw=h+180, ans=norm(raw), rezi=art==='rezi';
    const base=`<b>1</b>  ${pad3(h)} plus 180`, w2=kursWeg(raw);
    return {art:'nav',
      frage: rezi?`Wie lautet der Gegenkurs zu Kurs ${pad3(h)}?`
                 :`Position auf Radial ${pad3(h)} eines Funkfeuers. Welcher Kurs führt direkt zur Station?`,
      einheit:'Grad',typ:'zahl',kurs:true,grafik:compass(h),loesungsGrafik:compass(h,ans),loesung:ans,
      weg:w2?[`${base} = ${raw}`,w2]:[`${base} = <b>${pad3(ans)}</b>`],
      hinweis: rezi?'Bei Werten über 180 werden 180 abgezogen statt addiert.'
                   :'Das Radial zeigt von der Station weg, zur Station führt der Gegenkurs.'};
  }
  if(art==='delta'){
    let t=randHdg(), d=((t-h+540)%360)-180;
    while(Math.abs(d)<10||Math.abs(d)===180){ t=randHdg(); d=((t-h+540)%360)-180; }
    return {art:'nav',frage:`Von Kurs ${pad3(h)} auf Kurs ${pad3(t)}. Wie viel Grad beträgt die kürzeste Drehung?`,
      einheit:'Grad',typ:'zahl',grafik:compass(h,t),loesungsGrafik:compass(h,t),loesung:Math.abs(d),
      weg:drehWeg(h,t,Math.abs(d)+' Grad nach '+(d>0?'rechts':'links')),
      hinweis:'Beide Drehrichtungen vergleichen, gedreht wird über die kleinere.'};
  }
  if(art==='side'){
    let t=randHdg(), d=((t-h+540)%360)-180;
    while(Math.abs(d)<15||Math.abs(d)===180){ t=randHdg(); d=((t-h+540)%360)-180; }
    return {art:'nav',frage:`Eigenkurs ${pad3(h)}, Zielkurs ${pad3(t)}. In welche Richtung ist die Drehung kürzer?`,
      typ:'wahl',optionen:['LINKS','RECHTS'],grafik:compass(h,t),loesungsGrafik:compass(h,t),loesung:d>0?'RECHTS':'LINKS',
      weg:drehWeg(h,t,(d>0?'RECHTS':'LINKS')+' mit '+Math.abs(d)+' Grad'),
      hinweis:'Liegt der Zielkurs innerhalb der nächsten 180 Grad im Uhrzeigersinn, wird rechts gedreht.'};
  }
  const rb=CFG.stufe==='leicht'?rnd(1,17)*10:rnd(1,35)*5, rechts=Math.random()<.5;
  const raw=h+(rechts?rb:-rb), ans=norm(raw);
  const base=`<b>1</b>  Kurs ${pad3(h)} ${rechts?'plus':'minus'} ${rb}`, w2=kursWeg(raw);
  return {art:'nav',frage:`Eigenkurs ${pad3(h)}. Kontakt in relativer Peilung ${rb} Grad ${rechts?'steuerbord':'backbord'}. Wie lautet die rechtweisende Peilung?`,
    einheit:'Grad',typ:'zahl',kurs:true,grafik:compass(h),loesungsGrafik:compass(h,ans),loesung:ans,
    weg:w2?[`${base} = ${raw}`,w2]:[`${base} = <b>${pad3(ans)}</b>`],
    hinweis:'Steuerbord ist rechts und wird addiert, backbord ist links und wird abgezogen.'};
}

/* =========================================================
   3  FLUGRECHNEN
   ========================================================= */
function hhmm(min){ min=((min%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,'0')+String(min%60).padStart(2,'0'); }
function genFlug(){
  const gsPool=[120,180,240,300,360], art=pick(['zeit','strecke','sprit','sink','glide','regel60','reserve','uhr','reichweite']);

  if(art==='zeit'){
    const gs=pick(gsPool), nmMin=gs/60, min=rnd(4,40), dist=nmMin*min;
    return {art:'flug',frage:`Grundgeschwindigkeit ${gs} Knoten. Wie viele Minuten benötigt die Strecke von ${dist} nautischen Meilen?`,
      einheit:'Minuten',typ:'zahl',loesung:min,
      weg:[`<b>1</b>  ${gs} ÷ 60 = ${nmMin} Meilen pro Minute`,
           `<b>2</b>  ${dist} ÷ ${nmMin} = <b>${min}</b> Minuten`],
      hinweis:'Knoten geteilt durch 60 ergibt nautische Meilen pro Minute.'};
  }
  if(art==='strecke'){
    const gs=pick(gsPool), nmMin=gs/60, min=rnd(5,45);
    return {art:'flug',frage:`Flugzeit ${min} Minuten bei ${gs} Knoten Grundgeschwindigkeit. Welche Strecke wird zurückgelegt?`,
      einheit:'nautische Meilen',typ:'zahl',loesung:nmMin*min,
      weg:[`<b>1</b>  ${gs} ÷ 60 = ${nmMin} Meilen pro Minute`,
           `<b>2</b>  ${nmMin} × ${min} = <b>${nmMin*min}</b> Meilen`],
      hinweis:'Strecke ist Geschwindigkeit mal Zeit, hier in Minuten gerechnet.'};
  }
  if(art==='sprit'){
    const proMin=rnd(3,12), proStd=proMin*60, min=pick([10,15,20,25,30,40,45,50,75,90]);
    return {art:'flug',frage:`Verbrauch ${proStd} Liter pro Stunde. Wie viel Kraftstoff erfordern ${min} Minuten Flugzeit?`,
      einheit:'Liter',typ:'zahl',loesung:proMin*min,
      weg:[`<b>1</b>  ${proStd} ÷ 60 = ${proMin} Liter pro Minute`,
           `<b>2</b>  ${proMin} × ${min} = <b>${proMin*min}</b> Liter`],
      hinweis:'Verbrauch zuerst auf die Minute herunterbrechen.'};
  }
  if(art==='reichweite'){
    const proStd=rnd(2,9)*50, std=rnd(2,5), tank=proStd*std;
    return {art:'flug',frage:`Tankinhalt ${tank} Liter bei ${proStd} Litern Verbrauch pro Stunde. Wie viele Minuten Flugzeit stehen zur Verfügung?`,
      einheit:'Minuten',typ:'zahl',loesung:std*60,
      weg:[`<b>1</b>  ${tank} ÷ ${proStd} = ${std} Stunden`,
           `<b>2</b>  ${std} × 60 = <b>${std*60}</b> Minuten`],
      hinweis:'Das Ergebnis ist in Minuten anzugeben.'};
  }
  if(art==='sink'){
    const rate=pick([300,400,500,600,800,1000]), min=rnd(3,15), hoehe=rate*min;
    return {art:'flug',frage:`Sinkflug von ${hoehe} Fuß auf Meereshöhe mit ${rate} Fuß pro Minute. Wie lange dauert der Sinkflug?`,
      einheit:'Minuten',typ:'zahl',loesung:min,
      weg:[`<b>1</b>  ${hoehe} ÷ ${rate} = <b>${min}</b> Minuten`],
      hinweis:'Höhendifferenz durch Sinkrate ergibt die Zeit.'};
  }
  if(art==='glide'){
    const gs=pick([90,100,120,140,150,180]);
    return {art:'flug',frage:`Faustformel für den Dreigradanflug: Grundgeschwindigkeit halbieren und mit zehn multiplizieren. Welche Sinkrate ergibt sich bei ${gs} Knoten?`,
      einheit:'Fuß pro Minute',typ:'zahl',loesung:gs/2*10,
      weg:[`<b>1</b>  ${gs} ÷ 2 = ${gs/2}`,`<b>2</b>  ${gs/2} × 10 = <b>${gs/2*10}</b> Fuß pro Minute`],
      hinweis:'Die Faustformel ergibt einen Anflugwinkel von etwa drei Grad.'};
  }
  if(art==='regel60'){
    const dist=pick([15,20,30,60]), grad=rnd(2,8), ab=dist*grad/60;
    return {art:'flug',frage:`Sechzigerregel: nach ${dist} Meilen beträgt der Versatz zum Sollkurs ${ab} Meilen. Wie groß ist die Kursabweichung?`,
      einheit:'Grad',typ:'zahl',loesung:grad,
      weg:[`<b>1</b>  Abweichung mal 60: ${ab} × 60 = ${ab*60}`,
           `<b>2</b>  Geteilt durch die Strecke: ${ab*60} ÷ ${dist} = <b>${grad}</b> Grad`],
      hinweis:'Auf 60 Meilen entspricht ein Grad genau einer Meile Versatz.'};
  }
  if(art==='reserve'){
    const grund=rnd(3,12)*100, p=pick([10,20,25,50]);
    return {art:'flug',frage:`Grundbedarf ${grund} Liter. Welche Tankmenge ergibt sich einschließlich ${p} Prozent Reserve?`,
      einheit:'Liter',typ:'zahl',loesung:grund*(100+p)/100,
      weg:[`<b>1</b>  Reserve: ${grund} × ${p} ÷ 100 = ${grund*p/100}`,
           `<b>2</b>  Summe: ${grund} plus ${grund*p/100} = <b>${grund*(100+p)/100}</b> Liter`],
      hinweis:'Die Reserve wird auf den Grundbedarf addiert.'};
  }
  const start=rnd(0,23)*60+pick([0,5,10,15,20,25,30,35,40,45,50,55]);
  const dauer=rnd(1,5)*60+pick([0,10,15,20,25,35,40,50]);
  const an=start+dauer;
  return {art:'flug',frage:`Abflug ${hhmm(start)} UTC, Flugzeit ${Math.floor(dauer/60)} Stunden und ${dauer%60} Minuten. Wie lautet die Landezeit? Antwort als vier Ziffern.`,
    einheit:'UTC, zum Beispiel 1425',typ:'zahl',loesung:parseInt(hhmm(an),10),ziffern4:true,
    weg:[`<b>1</b>  Stunden: ${Math.floor(start/60)} plus ${Math.floor(dauer/60)} = ${Math.floor(start/60)+Math.floor(dauer/60)}`,
         `<b>2</b>  Minuten: ${start%60} plus ${dauer%60} = ${start%60+dauer%60}`,
         `<b>3</b>  Ergebnis nach Übertrag: <b>${hhmm(an)}</b> UTC`],
    hinweis:'Ab 60 Minuten wird eine Stunde übertragen, nach 2359 beginnt die Zählung bei 0000.'};
}

function gauge(inner,name){
  return `<div><svg class="gauge" viewBox="0 0 100 100">
    <circle class="dial" cx="50" cy="50" r="46"/>${inner}</svg>
    <div class="gname">${name}</div></div>`;
}
function svgHorizon(pitch,bank){
  const id='h'+(++uid), p=pitch*1.8;
  let bt='';
  [0,10,20,30,45,60,-10,-20,-30,-45,-60].forEach(d=>{
    const a=(d-90)*Math.PI/180, r1=d===0?34:38, r2=42;
    bt+=`<line x1="${50+r1*Math.cos(a)}" y1="${50+r1*Math.sin(a)}" x2="${50+r2*Math.cos(a)}" y2="${50+r2*Math.sin(a)}" stroke="#9fb3c6" stroke-width="${d===0?1.6:1}"/>`;
  });
  let pl='';
  [-20,-10,10,20].forEach(d=>{
    const w=Math.abs(d)===20?9:5;
    pl+=`<line x1="${50-w}" y1="${50-d*1.8}" x2="${50+w}" y2="${50-d*1.8}" stroke="#e6eef7" stroke-width=".9"/>`;
  });
  return gauge(`
    <defs><clipPath id="${id}"><circle cx="50" cy="50" r="40"/></clipPath></defs>
    <g clip-path="url(#${id})">
      <g transform="rotate(${-bank} 50 50)">
        <g transform="translate(0 ${p})">
          <rect x="-60" y="-90" width="220" height="140" fill="#2f6fa8"/>
          <rect x="-60" y="50" width="220" height="140" fill="#7a5a2a"/>
          <line x1="-60" y1="50" x2="160" y2="50" stroke="#e6eef7" stroke-width="1.2"/>
          ${pl}
        </g>
        ${bt}
      </g>
    </g>
    <polygon points="50,14 46.5,8 53.5,8" fill="#ffb020"/>
    <path d="M28 50 h14 M58 50 h14" stroke="#ffb020" stroke-width="2.4" fill="none"/>
    <circle cx="50" cy="50" r="1.8" fill="#ffb020"/>`,'HORIZONT');
}
function svgAlt(alt){
  let m='';
  for(let i=0;i<50;i++){
    const a=(i*7.2-90)*Math.PI/180, maj=i%5===0, r1=maj?34:38;
    m+=`<line x1="${50+r1*Math.cos(a)}" y1="${50+r1*Math.sin(a)}" x2="${50+42*Math.cos(a)}" y2="${50+42*Math.sin(a)}" stroke="${maj?'#9fb3c6':'#3b5266'}" stroke-width="${maj?1.3:.7}"/>`;
    if(maj){ const b=(i*7.2-90)*Math.PI/180;
      m+=`<text class="dlbl" x="${50+27*Math.cos(b)}" y="${50+27*Math.sin(b)}">${i/5}</text>`; }
  }
  const nd=(deg,len,w,col)=>{const a=(deg-90)*Math.PI/180;
    return `<line x1="${50-6*Math.cos(a)}" y1="${50-6*Math.sin(a)}" x2="${50+len*Math.cos(a)}" y2="${50+len*Math.sin(a)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;};
  return gauge(m
    + nd((alt%100000)/100000*360, 40, 1.2, '#4fd6e0')
    + nd((alt%10000)/10000*360, 20, 4, '#ffb020')
    + nd((alt%1000)/1000*360, 34, 2, '#e6eef7')
    + `<circle cx="50" cy="50" r="2.5" fill="#9fb3c6"/>`,'HÖHE IN FUSS');
}
function svgIas(v){
  let m='';
  for(let s=0;s<=200;s+=10){
    const deg=30+s*1.5, a=(deg-90)*Math.PI/180, maj=s%20===0;
    m+=`<line x1="${50+(maj?33:38)*Math.cos(a)}" y1="${50+(maj?33:38)*Math.sin(a)}" x2="${50+42*Math.cos(a)}" y2="${50+42*Math.sin(a)}" stroke="${maj?'#9fb3c6':'#3b5266'}" stroke-width="${maj?1.3:.7}"/>`;
    if(s%40===0) m+=`<text class="dlbl" x="${50+25*Math.cos(a)}" y="${50+25*Math.sin(a)}">${s}</text>`;
  }
  const a=(30+v*1.5-90)*Math.PI/180;
  return gauge(m+`<line x1="${50-6*Math.cos(a)}" y1="${50-6*Math.sin(a)}" x2="${50+34*Math.cos(a)}" y2="${50+34*Math.sin(a)}" stroke="#ffb020" stroke-width="2.4" stroke-linecap="round"/><circle cx="50" cy="50" r="2.5" fill="#9fb3c6"/>`,'FAHRT IN KNOTEN');
}
function svgHsi(hdg){
  let m='', lbl='';
  for(let d=0;d<360;d+=10){
    const maj=d%30===0, a=(d-hdg-90)*Math.PI/180;
    m+=`<line x1="${50+(maj?31:37)*Math.cos(a)}" y1="${50+(maj?31:37)*Math.sin(a)}" x2="${50+41*Math.cos(a)}" y2="${50+41*Math.sin(a)}" stroke="${maj?'#9fb3c6':'#3b5266'}" stroke-width="${maj?1.4:.8}"/>`;
    if(maj){
      const l=d===0?'N':d===90?'E':d===180?'S':d===270?'W':String(d/10);
      lbl+=`<text class="dlbl" x="${50+23*Math.cos(a)}" y="${50+23*Math.sin(a)}">${l}</text>`;
    }
  }
  return gauge(m+lbl+`
    <polygon points="50,14 46.5,7.5 53.5,7.5" fill="#ffb020"/>
    <path d="M50 40 v20 M42 56 h16 M46 62 h8" stroke="#ffb020" stroke-width="1.6" fill="none"/>`,'KURS');
}
function instrPanel(v){
  return `<div class="panel">${svgHorizon(v.pitch,v.bank)}${svgAlt(v.alt)}${svgIas(v.ias)}${svgHsi(v.hdg)}</div>`;
}
function genInstr(){
  const leicht=CFG.stufe==='leicht';
  const v={
    alt: leicht ? rnd(1,19)*500 : rnd(2,39)*100 + (CFG.stufe==='schwer'?rnd(0,9)*1000:0),
    ias: leicht ? rnd(3,19)*10 : rnd(6,19)*10,

    bank: pick(leicht?[0,10,20,30]:[0,10,15,20,30,45,60])*(Math.random()<.5?-1:1),
    pitch: pick(leicht?[0,10,-10]:[0,5,10,15,-5,-10,-15])
  };
  if(v.alt>19900) v.alt=19900;
  const panel=instrPanel(v);
  const opts=['alt','ias','hdg','pitch'];
  if(v.bank!==0) opts.push('bank','banks');
  const w=pick(opts);
  const basis={art:'instr',grafik:panel,loesungsGrafik:panel};

  if(w==='alt'){
    const t=Math.floor(v.alt/1000), hs=(v.alt%1000)/100;
    return Object.assign(basis,{frage:'Welche Höhe zeigt der Höhenmesser?',einheit:'Fuß',typ:'zahl',loesung:v.alt,
      weg:[`<b>1</b>  Kurze gelbe Nadel steht auf ${t}, also ${t*1000} Fuß`,
           `<b>2</b>  Lange weiße Nadel steht auf ${hs}, also ${hs*100} Fuß`,
           `<b>3</b>  Summe: <b>${v.alt}</b> Fuß`],
      hinweis:'Gelb zählt Tausender, Weiß zählt Hunderter, die dünne türkise Nadel steht für Zehntausender.'});
  }
  if(w==='ias'){
    return Object.assign(basis,{frage:'Welche Geschwindigkeit zeigt der Fahrtmesser?',einheit:'Knoten',typ:'zahl',loesung:v.ias,
      weg:[`<b>1</b>  Ein Skalenstrich entspricht 10 Knoten`,
           `<b>2</b>  Die Nadel steht auf <b>${v.ias}</b> Knoten`],
      hinweis:'Beschriftet ist jeder vierte Strich, dazwischen in Zehnerschritten zählen.'});
  }
  if(w==='hdg'){
    return Object.assign(basis,{frage:'Welchen Kurs zeigt der Kursanzeiger?',einheit:'Grad',typ:'zahl',kurs:true,loesung:norm(v.hdg),
      weg:[`<b>1</b>  Abgelesen wird unter der Marke oben`,
           `<b>2</b>  Dort steht <b>${pad3(norm(v.hdg))}</b>`],
      hinweis:'Die Rose dreht sich, das Flugzeugsymbol steht fest. Ein Strich sind 10 Grad, beschriftet ist jeder dritte.'});
  }
  if(w==='pitch'){
    const l=v.pitch>0?'STEIGT':v.pitch<0?'SINKT':'HORIZONT';
    return Object.assign(basis,{frage:'Welche Längsneigung zeigt der künstliche Horizont?',typ:'wahl',optionen:['STEIGT','HORIZONT','SINKT'],loesung:l,
      weg:[`<b>1</b>  Das Symbol liegt ${v.pitch>0?'über':v.pitch<0?'unter':'genau auf'} der Horizontlinie`,
           `<b>2</b>  Längsneigung etwa ${Math.abs(v.pitch)} Grad, also <b>${l}</b>`],
      hinweis:'Symbol über der Linie bedeutet Steigflug, Symbol unterhalb bedeutet Sinkflug.'});
  }
  if(w==='bank'){
    return Object.assign(basis,{frage:'Wie viel Grad Querneigung zeigt der künstliche Horizont?',einheit:'Grad',typ:'zahl',loesung:Math.abs(v.bank),
      weg:[`<b>1</b>  Die Marke steht auf ${Math.abs(v.bank)} Grad`,
           `<b>2</b>  Querneigung <b>${Math.abs(v.bank)}</b> Grad nach ${v.bank>0?'rechts':'links'}`],
      hinweis:'Die Skala trägt Marken bei 10, 20, 30, 45 und 60 Grad.'});
  }
  return Object.assign(basis,{frage:'In welche Richtung ist das Flugzeug geneigt?',typ:'wahl',optionen:['LINKS','RECHTS'],loesung:v.bank>0?'RECHTS':'LINKS',
    weg:[`<b>1</b>  Die Horizontlinie fällt nach ${v.bank>0?'links':'rechts'} ab`,
         `<b>2</b>  Also <b>${v.bank>0?'RECHTS':'LINKS'}</b> mit ${Math.abs(v.bank)} Grad`],
    hinweis:'Die tiefere Tragfläche zeigt die Neigungsrichtung.'});
}

   ========================================================= */
function genReihe(){
  const typ=pick(CFG.stufe==='leicht'?['add','add','mul']:['add','mul','alt','quad','fib','doppel']);
  let s=[], regel='', n=6;
  if(typ==='add'){ const d=rnd(2,12)*(Math.random()<.25?-1:1);
    const a=d>0?rnd(2,30):rnd(3,20)+n*Math.abs(d);
    for(let i=0;i<=n;i++) s.push(a+i*d); regel=`Jeder Schritt ${d>0?'plus':'minus'} ${Math.abs(d)}`; }
  else if(typ==='mul'){ const a=rnd(1,6), f=pick([2,3]);
    for(let i=0;i<=n;i++) s.push(a*Math.pow(f,i)); n=5; s=s.slice(0,6); regel=`Jeder Schritt mal ${f}`; }
  else if(typ==='alt'){ const d1=rnd(2,9), d2=rnd(2,9), a=rnd(3,20)+3*d2;
    let v=a; for(let i=0;i<=n;i++){ s.push(v); v+= i%2===0?d1:-d2; } regel=`Abwechselnd plus ${d1} und minus ${d2}`; }
  else if(typ==='quad'){ const a=rnd(1,5);
    for(let i=0;i<=n;i++) s.push((a+i)*(a+i)); regel=`Quadratzahlen ab ${a} mal ${a}`; }
  else if(typ==='fib'){ let x=rnd(1,6), y=rnd(2,9); s=[x,y];
    for(let i=2;i<=n;i++) s.push(s[i-1]+s[i-2]); regel='Summe der beiden Vorgänger'; }
  else { const a=rnd(2,9), d=rnd(2,7);
    let v=a; for(let i=0;i<=n;i++){ s.push(v); v = i%2===0 ? v*2 : v+d; } regel=`Abwechselnd mal 2 und plus ${d}`; }
  const ans=s[s.length-1], zeigen=s.slice(0,-1);
  return {art:'reihe',frage:`Wie geht die Reihe weiter?<br><span class="mono" style="font-size:22px;color:var(--amber);letter-spacing:2px">${zeigen.join('   ')}   ?</span>`,
    einheit:'nächste Zahl',typ:'zahl',loesung:ans,
    weg:[`<b>1</b>  Regel: ${regel}`,
         `<b>2</b>  Vollständig: ${s.join(', ')}`,
         `<b>3</b>  Gesucht war <b>${ans}</b>`],
    hinweis:'Zuerst die Differenzen benachbarter Glieder bilden, anschließend auf Faktoren prüfen.'};
}

/* =========================================================
   Kompass
   ========================================================= */
function compass(h,t){
  const R=88, cx=100, cy=100;
  let ticks='';
  for(let d=0;d<360;d+=10){
    const maj=d%30===0, r1=maj?R-13:R-8, a=(d-90)*Math.PI/180;
    ticks+=`<line class="tick ${maj?'tickmaj':''}" x1="${cx+r1*Math.cos(a)}" y1="${cy+r1*Math.sin(a)}" x2="${cx+R*Math.cos(a)}" y2="${cy+R*Math.sin(a)}"/>`;
    if(maj){ const rl=R-26, lbl=d===0?'N':d===90?'E':d===180?'S':d===270?'W':String(d/10);
      ticks+=`<text class="roselbl" x="${cx+rl*Math.cos(a)}" y="${cy+rl*Math.sin(a)+3}">${lbl}</text>`; }
  }
  const nd=(deg,col,len)=>{const a=(deg-90)*Math.PI/180;
    return `<line class="needle" style="stroke:${col}" x1="${cx}" y1="${cy}" x2="${cx+len*Math.cos(a)}" y2="${cy+len*Math.sin(a)}"/>`;};
  return `<svg class="compass" width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">
    <circle class="rose" cx="${cx}" cy="${cy}" r="${R}"/>${ticks}
    ${h?nd(h,'#ffb020',R-30):''}${t?nd(t,'#4fd6e0',R-44):''}
    <circle cx="${cx}" cy="${cy}" r="4" fill="#ffb020"/></svg>`;
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }
function genEnglisch(){
  const pool = CFG.stufe==='leicht'?EN.leicht : CFG.stufe==='mittel'?EN.leicht.concat(EN.mittel) : EN.mittel.concat(EN.schwer);
  const [satz,opt,loes,regel]=pick(pool);
  return {art:'englisch',
    frage:`Choose the correct option.<br><span class="mono" style="display:block;margin-top:10px;font-size:18px;color:var(--amber);line-height:1.5">${satz}</span>`,
    typ:'wahl', optionen:shuffle(opt), loesung:loes,
    weg:[`<b>1</b>  Richtig: <b>${satz.replace('___',loes)}</b>`,`<b>2</b>  Regel: ${regel}`],
    hinweis:'Das Signalwort im Satz gibt Zeitform und Struktur vor.'};
}

const FELD={
  alt:{label:'HÖHE', kurz:'Höhe', einheit:'Fuß', gauge:v=>svgAlt(v)},
  ias:{label:'FAHRT', kurz:'Fahrt', einheit:'Knoten', gauge:v=>svgIas(v)},
  hdg:{label:'KURS', kurz:'Kurs', einheit:'Grad', gauge:v=>svgHsi(v)}
};
function feldNamen(){ const n=S.felder.map(f=>FELD[f].kurz); return n.length<2?n[0]:n.slice(0,-1).join(', ')+' und '+n[n.length-1]; }
function merkZeit(){ return CFG.stufe==='leicht'?12:CFG.stufe==='mittel'?9:7; }
function randWerte(){
  const w={};
  w.alt = CFG.stufe==='leicht'?rnd(2,19)*500 : CFG.stufe==='mittel'?rnd(2,39)*100 : Math.min(19900, rnd(2,39)*100+rnd(0,9)*1000);
  w.ias = CFG.stufe==='leicht'?rnd(2,9)*20 : rnd(6,19)*10;
  w.hdg = CFG.stufe==='leicht'?rnd(1,12)*30 : rnd(1,36)*10;
  return w;
}
function wertePanel(w){ return `<div class="panel">${S.felder.map(f=>FELD[f].gauge(w[f])).join('')}</div>`; }
function runSteps(steps,next){ const go=i=>i>=steps.length?next():steps[i](()=>go(i+1)); go(0); }
function zeigeAnzeige(eyebrow,next){
  if(CFG.ablese) return showWerteKontrolle(eyebrow,S.werte,next);
  showWerte(eyebrow,S.werte,feldNamen()+' ablesen und merken.',merkZeit(),next);
}
function showWerteKontrolle(eyebrow,w,next){
  clearTimers(); keyMode='eingabe'; slot.classList.add('hidden'); beep(960,160); buzz(30);
  const secs=merkZeit()+10;
  view.innerHTML=`
    <div class="card">
      <div class="eyebrow">${eyebrow}</div>
      ${wertePanel(w)}
      <p class="hold" style="text-align:center">${feldNamen()} ablesen, eintragen und merken.</p>
      ${S.felder.map(f=>`<div class="frow"><label>${FELD[f].label}</label><input id="k_${f}" type="text" inputmode="numeric" autocomplete="off" placeholder="?"><span>${FELD[f].einheit}</span></div>`).join('')}
      <button class="btn" id="ok">BESTÄTIGEN</button>
      <div class="tbar" id="tb"><span id="tbf"></span></div>
    </div>
    <div id="fbHost"></div>`;
  let fertig=false;
  const send=()=>{
    if(fertig) return; fertig=true;
    clearTimers(); keyMode=null;
    let alle=true;
    const zeilen=S.felder.map(f=>{
      const el=document.getElementById('k_'+f), raw=(el.value||'').trim();
      let n=parseFloat(raw.replace(',','.'));
      if(f==='hdg'&&!isNaN(n)) n=norm(n);
      const soll=f==='hdg'?norm(w[f]):w[f];
      const ok=!isNaN(n)&&Math.abs(n-soll)<0.001;
      S.ab.n++; if(ok) S.ab.ok++; else alle=false;
      el.disabled=true;
      return `<b>${FELD[f].label}</b>  ${f==='hdg'?pad3(soll):soll} ${FELD[f].einheit}${ok?', korrekt':', abgelesen '+(raw===''?'keine':raw)}`;
    });
    document.getElementById('ok').disabled=true;
    beep(alle?1050:240, alle?90:180);
    document.getElementById('fbHost').innerHTML=`
      <div class="fb ${alle?'ok':'no'}">
        <div class="verdict">${alle?'ABLESUNG KORREKT':'ABLESEFEHLER'}</div>
        <div class="sol">${S.felder.map(f=>(f==='hdg'?pad3(norm(w[f])):w[f])+' '+FELD[f].einheit).join('  ·  ')}</div>
        <ul class="weg">${zeilen.map(z=>`<li>${z}</li>`).join('')}</ul>
        <p class="tip">Diese Werte sind ab jetzt zu merken.</p>
      </div>
      <button class="btn" id="weiter">WEITER</button>`;
    warteAufWeiter(next);
  };
  document.getElementById('ok').addEventListener('click',send);
  S.felder.forEach(f=>document.getElementById('k_'+f).addEventListener('keydown',e=>{if(e.key==='Enter')send();}));
  setTimeout(()=>{const el=document.getElementById('k_'+S.felder[0]); if(el) el.focus();},60);
  const fill=document.getElementById('tbf'), bar=document.getElementById('tb'), t0=Date.now();
  tickId=setInterval(()=>{
    const p=1-(Date.now()-t0)/(secs*1000);
    fill.style.width=Math.max(0,p*100)+'%';
    if(p<.25) bar.classList.add('low');
    if(p<=0) send();
  },100);
}
function showWerte(eyebrow,w,text,secs,next,danger){
  clearTimers(); keyMode='hold'; slot.classList.add('hidden');
  beep(danger?320:960,160); buzz(danger?[40,60,40]:30);
  view.innerHTML=`
    <div class="card ${danger?'warn':''}" style="text-align:center">
      <div class="eyebrow">${eyebrow}</div>
      ${wertePanel(w)}
      <p class="hold">${text}</p>
      <div class="countdown mono" id="cd">${secs}</div>
    </div>
    <button class="btn ghost" id="skip">VERSTANDEN</button>`;
  let left=secs; const el=document.getElementById('cd');
  const done=()=>{clearTimers();keyMode=null;next();};
  tickId=setInterval(()=>{left--;if(el)el.textContent=left;if(left<=0)done();},1000);
  document.getElementById('skip').addEventListener('click',done);
  showLetter.done=done;
}

/* =========================================================
   Lauf
   ========================================================= */
function startSession(){
  S={letter:pick(AZ), block:0, tasksLeft:0, rc:{ok:0,n:0}, ri:{ok:0,n:0}, ab:{ok:0,n:0}, cat:{},
     streak:0, best:0, trace:[], wtrace:[], werte:null, t0:Date.now(), rt:[], rtAbruf:[],
     felder: CFG.stufe==='schwer'?['alt','ias','hdg']:['alt','ias']};
  KEYS.forEach(k=>S.cat[k]={ok:0,n:0,rt:[]});
  S.trace=[`<b>1</b>  Ausgangsbuchstabe <b>${S.letter}</b>`];
  const boxen=[];
  if(CFG.merk.buchstabe) boxen.push('B');
  if(CFG.merk.instrument) S.felder.forEach(f=>boxen.push(FELD[f].label.charAt(0)));
  slot.innerHTML='<span class="lbl">SPEICHER</span>'+boxen.map(b=>`<span class="box">${b}</span>`).join('');
  menuBtn.classList.remove('hidden');
  const steps=[];
  if(CFG.merk.buchstabe) steps.push(cb=>showLetter('AKTIVER BUCHSTABE',S.letter,'Buchstabe merken. Gültig bis zur nächsten Ansage.',4,cb));
  if(CFG.merk.instrument) steps.push(cb=>{ S.werte=randWerte(); S.wtrace=[`<b>1</b>  Ausgangsanzeige`];
    zeigeAnzeige('ANZEIGE MERKEN',cb); });
  runSteps(steps,startBlock);
}
function startBlock(){
  S.block++;
  if(S.block>CFG.bloecke) return renderResults();
  prog.style.width=Math.round((S.block-1)/CFG.bloecke*100)+'%';
  const dd=DICHTE[CFG.dichte]; S.tasksLeft=rnd(dd[0],dd[1]);
  nextInBlock();
}
function nextInBlock(){
  if(S.tasksLeft<=0) return renderRecall();
  S.tasksLeft--;
  if(CFG.stufe==='schwer'&&CFG.dichte!=='wenig'&&Math.random()<.2) return renderEvent(renderTask);
  renderTask();
}
function warteAufWeiter(next){
  keyMode='weiter';
  contFn=()=>{contFn=null;keyMode=null;next();};
  const b=document.getElementById('weiter');
  if(b){ b.addEventListener('click',()=>{if(contFn)contFn();});
         b.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

function renderEvent(next){
  const arten=[];
  if(CFG.merk.buchstabe) arten.push('b');
  if(CFG.merk.instrument) arten.push('i');
  if(pick(arten)==='i'){
    if(CFG.stufe==='schwer'&&Math.random()<.3){
      S.wtrace.push(`<b>${S.wtrace.length+1}</b>  Störanzeige ohne Gültigkeit`);
      return showWerte('STÖRANZEIGE',randWerte(),'Ablenkung ohne Gültigkeit. Die gemerkten Werte bleiben bestehen.',4,next,true);
    }
    S.werte=randWerte();
    S.wtrace=[`<b>1</b>  Anzeige ersetzt`];
    return zeigeAnzeige('NEUE ANZEIGE',next);
  }
  const r=Math.random();
  if(CFG.stufe!=='leicht'&&r<.35){
    const step=pick([1,1,2]), dir=Math.random()<.5?1:-1, old=S.letter;
    S.letter=AZ[((AZ.indexOf(old)+dir*step)%26+26)%26];
    S.trace.push(`<b>${S.trace.length+1}</b>  ${old} um ${step} ${dir>0?'vor':'zurück'} versetzt ergibt <b>${S.letter}</b>`);
    clearTimers(); keyMode='hold'; slot.classList.add('hidden'); beep(660,180);
    view.innerHTML=`
      <div class="card letterstage">
        <div class="eyebrow">ANWEISUNG</div>
        <div class="bigletter mono" style="font-size:56px;letter-spacing:0">${step} ${dir>0?'VOR':'ZURÜCK'}</div>
        <p class="hold">Gemerkten Buchstaben um ${step} ${step===1?'Stelle':'Stellen'} ${dir>0?'nach vorn':'zurück'} versetzen. Das Ergebnis wird nicht angezeigt.</p>
        <div class="countdown mono" id="cd">6</div>
      </div>
      <button class="btn ghost" id="skip">VERSTANDEN</button>`;
    let left=6; const el=document.getElementById('cd');
    const done=()=>{clearTimers();keyMode=null;next();};
    tickId=setInterval(()=>{left--;if(el)el.textContent=left;if(left<=0)done();},1000);
    document.getElementById('skip').addEventListener('click',done);
    showLetter.done=done;
    return;
  }
  if(CFG.stufe==='schwer'&&r<.6){
    let st=pick(AZ); while(st===S.letter) st=pick(AZ);
    S.trace.push(`<b>${S.trace.length+1}</b>  ${st} ohne Gültigkeit`);
    return showLetter('STÖRSIGNAL',st,'Ablenkung ohne Gültigkeit. Der gemerkte Buchstabe bleibt bestehen.',4,next,true);
  }
  let neu=pick(AZ); while(neu===S.letter) neu=pick(AZ);
  S.letter=neu;
  S.trace=[`<b>1</b>  Neue Ansage: <b>${neu}</b>`];
  showLetter('NEUER AKTIVER BUCHSTABE',neu,'Neuer Buchstabe gültig. Der vorherige verfällt.',4,next);
}

function renderTask(){
  clearTimers();
  slot.classList.remove('hidden');
  const aktiv=KEYS.filter(k=>CFG.typen[k]);
  const q=GEN[pick(aktiv)].fn();
  const secs=CFG.zeit;
  keyMode=q.typ==='zahl'?'zahl':'wahl';
  view.innerHTML=`
    <div class="card">
      <div class="qhead">
        <span class="tag">${GEN[q.art].label}</span>
        <span class="tclock mono">BLOCK ${S.block}/${CFG.bloecke}</span>
      </div>
      <p class="question">${q.frage}</p>
      ${q.grafik||''}
      ${q.typ==='zahl'?`
        <div class="answer">
          <input id="inp" type="text" inputmode="decimal" autocomplete="off" placeholder="?">
          <button id="ok">OK</button>
        </div>
        <div class="unit">${q.einheit||''}</div>`:`
        <div class="row ${q.optionen.some(o=>o.length>9)?'stack':''}" style="margin-top:16px">
          ${q.optionen.map(o=>`<button class="chip" style="font-size:15px;padding:16px 6px" data-v="${o}">${o}</button>`).join('')}
        </div>`}
      ${secs?`<div class="tbar" id="tb"><span id="tbf"></span></div>`:''}
    </div>
    <div id="fbHost"></div>`;

  const tAuf=Date.now();
  const finish=val=>{
    clearTimers();
    const ok=val!==null&&check(q,val);
    const c=S.cat[q.art]; c.n++;
    if(val!==null){ const dt=Date.now()-tAuf; S.rt.push(dt); c.rt.push(dt); }
    if(ok){c.ok++;S.streak++;S.best=Math.max(S.best,S.streak);beep(1050,90);}
    else {S.streak=0;beep(240,180);buzz(60);}
    const soll=q.typ==='zahl'?(q.kurs?pad3(q.loesung):(q.ziffern4?String(q.loesung).padStart(4,'0'):q.loesung)):q.loesung;
    document.getElementById('fbHost').innerHTML=`
      <div class="fb ${ok?'ok':'no'}">
        <div class="verdict">${ok?'RICHTIG':(val===null?'ZEIT ABGELAUFEN':'FALSCH')}</div>
        <div class="sol">Lösung: ${soll}${q.einheit&&q.typ==='zahl'?' '+q.einheit:''}</div>
        <ul class="weg">${(q.weg||[]).map(w=>`<li>${w}</li>`).join('')}</ul>
        <p class="tip">${q.hinweis||''}</p>
        ${q.loesungsGrafik||''}
      </div>
      <button class="btn" id="weiter">WEITER</button>`;
    document.querySelectorAll('.answer button,.row .chip,.answer input').forEach(b=>b.disabled=true);
    warteAufWeiter(nextInBlock);
  };

  if(q.typ==='zahl'){
    const inp=document.getElementById('inp');
    const send=()=>{const v=inp.value.trim(); if(v!=='') finish(v);};
    document.getElementById('ok').addEventListener('click',send);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
    setTimeout(()=>inp.focus(),60);
  } else {
    view.querySelectorAll('.row .chip').forEach(b=>b.addEventListener('click',()=>finish(b.dataset.v)));
    renderTask.chooseByKey=k=>{
      const b=[...view.querySelectorAll('.row .chip')].find(x=>!x.disabled&&x.dataset.v[0]===k);
      if(b) finish(b.dataset.v);
    };
  }
  if(secs){
    const fill=document.getElementById('tbf'), bar=document.getElementById('tb'), t0=Date.now();
    tickId=setInterval(()=>{
      const p=1-(Date.now()-t0)/(secs*1000);
      fill.style.width=Math.max(0,p*100)+'%';
      if(p<.25) bar.classList.add('low');
      if(p<=0) finish(null);
    },100);
  }
}
function check(q,val){
  if(q.typ==='wahl') return val===q.loesung;
  let n=parseFloat(String(val).replace(',','.').replace(':',''));
  if(isNaN(n)) return false;
  if(q.kurs) n=norm(n);
  return Math.abs(n-q.loesung)<0.001;
}

function renderRecall(){
  const arten=[];
  if(CFG.merk.buchstabe) arten.push(recallBuchstabe);
  if(CFG.merk.instrument) arten.push(recallWerte);
  const liste = (arten.length>1 && (CFG.stufe==='schwer'||Math.random()<.4)) ? arten : [pick(arten)];
  runSteps(liste.map(f=>cb=>f(cb)), afterRecall);
}
function afterRecall(){
  if(S.block>=CFG.bloecke) return renderResults();
  if(Math.random()<(CFG.stufe==='leicht'?.45:.6)) renderEvent(startBlock);
  else startBlock();
}
function recallBuchstabe(next){
  clearTimers(); keyMode='recall'; slot.classList.add('hidden'); beep(760,120);
  view.innerHTML=`
    <div class="card">
      <div class="eyebrow">ABFRAGE</div>
      <h2>Welcher Buchstabe ist aktuell gültig?</h2>
      <p class="sub">Auswahl antippen oder Taste drücken.</p>
      <div class="grid" id="g">${AZ.map(l=>`<button data-v="${l}">${l}</button>`).join('')}</div>
    </div>
    <div id="fbHost"></div>`;
  const tAb=Date.now();
  const answer=l=>{
    clearTimers(); keyMode=null;
    S.rtAbruf.push(Date.now()-tAb);
    const ok=l===S.letter;
    S.rc.n++;
    if(ok){S.rc.ok++;S.streak++;S.best=Math.max(S.best,S.streak);beep(1150,140);}
    else {S.streak=0;beep(200,260);buzz(120);}
    document.getElementById('g').querySelectorAll('button').forEach(b=>{
      b.disabled=true;
      if(b.dataset.v===S.letter){b.style.background='var(--green)';b.style.color='#06180d';}
      else if(b.dataset.v===l){b.style.background='var(--red)';b.style.color='#1a0505';}
    });
    document.getElementById('fbHost').innerHTML=`
      <div class="fb ${ok?'ok':'no'}">
        <div class="verdict">${ok?'RICHTIG':'FALSCH'}</div>
        <div class="sol">Gültig ist ${S.letter} wie ${NATO[S.letter]}</div>
        <ul class="weg">${S.trace.map(w=>`<li>${w}</li>`).join('')}</ul>
      </div>
      <button class="btn" id="weiter">WEITER</button>`;
    warteAufWeiter(next);
  };
  document.getElementById('g').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(b&&!b.disabled) answer(b.dataset.v);
  });
  recallBuchstabe.answer=answer;
}
function recallWerte(next){
  clearTimers(); keyMode='eingabe'; slot.classList.add('hidden'); beep(700,140);
  view.innerHTML=`
    <div class="card">
      <div class="eyebrow">ABFRAGE</div>
      <h2>Welche Werte zeigte die letzte gültige Anzeige?</h2>
      <p class="sub">Gemerkte Werte eintragen.</p>
      ${S.felder.map(f=>`<div class="frow"><label>${FELD[f].label}</label><input id="i_${f}" type="text" inputmode="numeric" autocomplete="off" placeholder="?"><span>${FELD[f].einheit}</span></div>`).join('')}
      <button class="btn" id="ok">BESTÄTIGEN</button>
    </div>
    <div id="fbHost"></div>`;
  const tAb=Date.now(); let fertig=false;
  const send=()=>{
    if(fertig) return; fertig=true;
    clearTimers(); keyMode=null;
    S.rtAbruf.push(Date.now()-tAb);
    let alle=true;
    const zeilen=S.felder.map(f=>{
      const raw=(document.getElementById('i_'+f).value||'').trim();
      let n=parseFloat(raw.replace(',','.'));
      if(f==='hdg'&&!isNaN(n)) n=norm(n);
      const soll=f==='hdg'?norm(S.werte[f]):S.werte[f];
      const ok=!isNaN(n)&&Math.abs(n-soll)<0.001;
      S.ri.n++; if(ok) S.ri.ok++; else alle=false;
      const zeig=f==='hdg'?pad3(soll):soll;
      return `<b>${FELD[f].label}</b>  ${zeig} ${FELD[f].einheit}${ok?', korrekt':', Eingabe '+(raw===''?'keine':raw)}`;
    });
    if(alle){S.streak++;S.best=Math.max(S.best,S.streak);beep(1150,140);}
    else {S.streak=0;beep(200,260);buzz(120);}
    S.felder.forEach(f=>document.getElementById('i_'+f).disabled=true);
    document.getElementById('ok').disabled=true;
    document.getElementById('fbHost').innerHTML=`
      <div class="fb ${alle?'ok':'no'}">
        <div class="verdict">${alle?'ALLE WERTE KORREKT':'ABWEICHUNG'}</div>
        <div class="sol">${S.felder.map(f=>(f==='hdg'?pad3(norm(S.werte[f])):S.werte[f])+' '+FELD[f].einheit).join('  ·  ')}</div>
        <ul class="weg">${zeilen.concat(S.wtrace).map(w=>`<li>${w}</li>`).join('')}</ul>
        ${wertePanel(S.werte)}
      </div>
      <button class="btn" id="weiter">WEITER</button>`;
    warteAufWeiter(next);
  };
  document.getElementById('ok').addEventListener('click',send);
  S.felder.forEach(f=>document.getElementById('i_'+f).addEventListener('keydown',e=>{if(e.key==='Enter')send();}));
  setTimeout(()=>{const el=document.getElementById('i_'+S.felder[0]); if(el) el.focus();},60);
}

function renderResults(){
  clearTimers(); keyMode=null; contFn=null;
  slot.classList.add('hidden'); menuBtn.classList.add('hidden'); prog.style.width='100%';
  const pc=o=>o.n?Math.round(o.ok/o.n*100):0;
  let ok=S.rc.ok+S.ri.ok, ges=S.rc.n+S.ri.n;
  KEYS.forEach(k=>{ok+=S.cat[k].ok;ges+=S.cat[k].n;});
  const total=ges?Math.round(ok/ges*100):0;
  const merk={ok:S.rc.ok+S.ri.ok,n:S.rc.n+S.ri.n}, rp=pc(merk);
  const dauer=Math.round((Date.now()-S.t0)/60000);
  const rtA=med(S.rt), rtB=med(S.rtAbruf);
  const vorher=ladeVerlauf().slice(-1)[0]||null;
  speichereLauf({t:Date.now(), stufe:CFG.stufe, bloecke:CFG.bloecke, gesamt:total, merk:rp,
                 ablese:S.ab.n?pc(S.ab):null, rt:rtA, dauer:dauer});
  const d=vorher?total-vorher.gesamt:null;
  const urteil = rp>=90?'Der Speicher hält unter Last. Nächste Stufe oder kürzere Zeitvorgabe wählen.'
    : rp>=70?'Solide Leistung. Die Störungen kosten weiterhin Treffer.'
    : 'Der Speicher bricht unter Ablenkung ab. Zunächst ohne Zeitvorgabe trainieren.';
  const zeilen=KEYS.filter(k=>S.cat[k].n>0).map(k=>
    `<div class="stat"><span class="k">${GEN[k].label.charAt(0)+GEN[k].label.slice(1).toLowerCase()}</span><span class="v">${S.cat[k].ok}/${S.cat[k].n} · ${pc(S.cat[k])}% · ${(med(S.cat[k].rt)/1000).toFixed(1)} s</span></div>`).join('');
  view.innerHTML=`
    <div class="eyebrow">AUSWERTUNG</div>
    <h1>Lauf beendet</h1>
    <div class="card">
      <div class="score"><div class="num mono">${total}%</div><div class="lbl">GESAMTTREFFER</div></div>
      <div class="bar"><span style="width:${total}%"></span></div>
      <p class="sub" style="text-align:center;margin-top:10px;font-size:13px">${d===null?'Erster gespeicherter Lauf':(d>=0?'+':'')+d+' Prozentpunkte gegenüber dem letzten Lauf'}</p>
    </div>
    <div class="card">
      ${S.rc.n?`<div class="stat"><span class="k">Buchstabe erinnert</span><span class="v" style="color:var(--amber)">${S.rc.ok}/${S.rc.n} · ${pc(S.rc)}%</span></div>`:''}
      ${S.ri.n?`<div class="stat"><span class="k">Instrumentenwerte erinnert</span><span class="v" style="color:var(--amber)">${S.ri.ok}/${S.ri.n} · ${pc(S.ri)}%</span></div>`:''}
      ${S.ab.n?`<div class="stat"><span class="k">Ablesung an der Anzeige</span><span class="v">${S.ab.ok}/${S.ab.n} · ${pc(S.ab)}%</span></div>`:''}
      ${zeilen}
      <div class="stat"><span class="k">Reaktionszeit je Aufgabe</span><span class="v">${(rtA/1000).toFixed(1)} s</span></div>
      <div class="stat"><span class="k">Abrufzeit bei der Abfrage</span><span class="v">${(rtB/1000).toFixed(1)} s</span></div>
      <div class="stat"><span class="k">Längste Serie</span><span class="v">${S.best}</span></div>
      <div class="stat"><span class="k">Stufe und Dauer</span><span class="v">${CFG.stufe.toUpperCase()} · ${dauer} min</span></div>
    </div>
    <p class="sub" style="margin-top:14px">${urteil}</p>
    ${S.ab.n&&pc(S.ab)<pc(S.ri)+1&&S.ri.n?`<p class="sub" style="margin-top:8px">Ein Teil der Fehler entsteht bereits beim Ablesen, nicht erst beim Merken.</p>`:''}
    <button class="btn" id="again">NEUER LAUF</button>
    <button class="btn ghost" id="hist">VERLAUF</button>
    <button class="btn ghost" id="home">HAUPTMENÜ</button>`;
  document.getElementById('again').addEventListener('click',startSession);
  document.getElementById('hist').addEventListener('click',renderVerlauf);
  document.getElementById('home').addEventListener('click',renderMenu);
}
function verlaufChart(v){
  const W=320,H=118,px=24,pb=16,pt=10;
  const n=v.length, xs=i=>px+(W-px-10)*(n<2?0:i/(n-1));
  const yq=x=>pt+(H-pt-pb)*(1-x/100);
  const rts=v.map(r=>r.rt||0), rmax=Math.max.apply(null,rts.concat([1])), rmin=Math.min.apply(null,rts);
  const yr=x=>pt+(H-pt-pb)*(1-(rmax===rmin?.5:(x-rmin)/(rmax-rmin)));
  const line=(pts,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" points="${pts}"/>`;
  const pq=v.map((r,i)=>xs(i)+','+yq(r.gesamt)).join(' ');
  const pr=v.map((r,i)=>xs(i)+','+yr(r.rt||0)).join(' ');
  let grid='';
  [0,50,100].forEach(g=>{ grid+=`<line x1="${px}" y1="${yq(g)}" x2="${W-10}" y2="${yq(g)}" stroke="#1e2b3a" stroke-width="1"/>
    <text x="${px-4}" y="${yq(g)+3}" fill="#6b7d92" font-size="8" text-anchor="end" font-family="monospace">${g}</text>`; });
  const dots=v.map((r,i)=>`<circle cx="${xs(i)}" cy="${yq(r.gesamt)}" r="2.4" fill="#ffb020"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${grid}
    ${n>1?line(pr,'#4fd6e0'):''}${n>1?line(pq,'#ffb020'):''}${dots}</svg>
    <p class="sub" style="font-size:12px;margin-top:6px">Gelb ist die Trefferquote in Prozent. Türkis ist die Reaktionszeit zwischen ${(rmin/1000).toFixed(1)} und ${(rmax/1000).toFixed(1)} Sekunden, unten schneller.</p>`;
}
function renderVerlauf(){
  clearTimers(); keyMode=null; contFn=null;
  slot.classList.add('hidden'); menuBtn.classList.add('hidden'); prog.style.width='0%';
  const v=ladeVerlauf();
  if(!v.length){
    view.innerHTML=`<div class="eyebrow">VERLAUF</div><h1>Keine Daten</h1>
      <p class="sub" style="margin-top:8px">${SPEICHER_OK?'Nach dem ersten abgeschlossenen Lauf erscheinen hier Trefferquote und Reaktionszeit über die Zeit.':'Der Speicher des Browsers ist nicht verfügbar. In der installierten Anwendung auf dem Startbildschirm funktioniert die Aufzeichnung.'}</p>
      <button class="btn ghost" id="back">ZURÜCK</button>`;
    document.getElementById('back').addEventListener('click',renderMenu); return;
  }
  const best=Math.max.apply(null,v.map(r=>r.gesamt));
  const letzte=v.slice(-5).reverse();
  const schnitt=Math.round(v.reduce((a,r)=>a+r.gesamt,0)/v.length);
  view.innerHTML=`
    <div class="eyebrow">VERLAUF</div>
    <h1>${v.length} ${v.length===1?'Lauf':'Läufe'}</h1>
    <div class="card">${verlaufChart(v)}</div>
    <div class="card">
      <div class="stat"><span class="k">Bestwert</span><span class="v" style="color:var(--amber)">${best}%</span></div>
      <div class="stat"><span class="k">Durchschnitt</span><span class="v">${schnitt}%</span></div>
      <div class="stat"><span class="k">Schnellste Reaktionszeit</span><span class="v">${(Math.min.apply(null,v.map(r=>r.rt||99999))/1000).toFixed(1)} s</span></div>
    </div>
    <div class="card">
      <div class="opt">Letzte Läufe</div>
      ${letzte.map(r=>`<div class="stat"><span class="k">${datum(r.t)} · ${r.stufe}</span><span class="v">${r.gesamt}% · ${(r.rt/1000).toFixed(1)} s</span></div>`).join('')}
    </div>
    <button class="btn ghost" id="back">ZURÜCK</button>
    <button class="btn ghost" id="clr" style="color:var(--red);border-color:var(--red)">VERLAUF LÖSCHEN</button>`;
  document.getElementById('back').addEventListener('click',renderMenu);
  document.getElementById('clr').addEventListener('click',()=>{ loescheVerlauf(); renderVerlauf(); });
}

/* Menütaste und Tastatur */
menuBtn.addEventListener('click',()=>modal.classList.remove('hidden'));
document.getElementById('mNo').addEventListener('click',()=>modal.classList.add('hidden'));
document.getElementById('mYes').addEventListener('click',()=>{modal.classList.add('hidden');renderMenu();});
document.addEventListener('keydown',e=>{
  if(!modal.classList.contains('hidden')) return;
  if(e.key==='Escape'&&S){modal.classList.remove('hidden');return;}
  if(keyMode==='weiter'){ if(e.key==='Enter'||e.key===' '){e.preventDefault();if(contFn)contFn();} return; }
  if(keyMode==='recall'&&/^[a-zA-Z]$/.test(e.key)){recallBuchstabe.answer(e.key.toUpperCase());return;}
  if(keyMode==='hold'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();if(showLetter.done)showLetter.done();return;}
  if(keyMode==='wahl'&&renderTask.chooseByKey){
    const m={ArrowLeft:'L',ArrowRight:'R',l:'L',r:'R',s:'S',h:'H'};
    const k=m[e.key]||m[e.key.toLowerCase()];
    if(k) renderTask.chooseByKey(k);
  }
});

renderMenu();
</script>
